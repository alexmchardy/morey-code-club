    <style>

            margin: 0;

            box-sizing: border-box;

        body {
            font-family: 'Arial', sans-serif;

<body>
    <h1>M Dash - Code Edition</h1>

    <div id="gameContainer">
        <canvas id="gameCanvas" width="800" height="400"></canvas>
        <div id="gameOver">
            <h2>Level Complete!</h2>
            <button onclick="nextLevel()">Next Level</button>
            <button onclick="showLevelSelect()">Level Select</button>
        </div>
        <div id="levelSelect">
            <h2>Select Level</h2>
            <div id="levelButtons"></div>
        </div>
    </div>

    <div id="controls">
        <button id="restartBtn" onclick="restartGame()">Restart</button>
        <button onclick="showLevelSelect()" style="background: #9C27B0;">Levels</button>
        <button id="codeBtn" onclick="toggleCodeDrawer()">Show Code</button>
        <button id="levelBtn" onclick="toggleLevelDrawer()">Level Editor</button>
    </div>

    <div id="instructions">
        <p><strong>Controls:</strong> Press SPACE or click to jump</p>
        <p><strong>Goal:</strong> Reach the end without hitting obstacles</p>
        <p><strong>Code Editor:</strong> Modify the game code and see changes in real-time</p>
    </div>

    <div id="codeDrawer">
        <h2>Game Code Editor</h2>
        <div id="codeEditorContainer"></div>
        <div id="codeControls">
            <button id="saveCodeBtn" onclick="applyCode()">Apply Changes</button>
            <button onclick="resetCode()" style="background: #f44336;">Reset Code</button>
            <button id="closeCodeBtn" onclick="toggleCodeDrawer()">Close</button>
        </div>
    </div>

    <div id="levelDrawer">
        <h2>Level Editor</h2>
        <div id="levelEditor"></div>
        <div id="codeControls">
            <button onclick="addNewLevel()">Add New Level</button>
            <button id="closeCodeBtn" onclick="toggleLevelDrawer()">Close</button>
        </div>
    </div>

    <script id="originalGameCode" type="text/plain">
// Game Configuration
const GAME_CONFIG = {
    canvas: null,
    ctx: null,
    width: 800,
    height: 400,
    groundHeight: 50,
    scrollSpeed: 4,
    gravity: 0.8,
    jumpForce: -15,
    playerSize: 30,
    playerColor: '#FF1493',
    groundColor: '#228B22',
    obstacleColor: '#8B0000'
};

// Game State
let gameState = {
    player: null,
    obstacles: [],
    scrollOffset: 0,
    isGameOver: false,
    isWin: false,
    currentLevel: 0,
    isJumping: false,
    highestCompletedLevel: -1
};

// Load saved progress from localStorage
function loadProgress() {
    const saved = localStorage.getItem('mdash_highest_level');
    gameState.highestCompletedLevel = saved ? parseInt(saved) : -1;
}

// Save progress to localStorage
function saveProgress() {
    localStorage.setItem('mdash_highest_level', gameState.highestCompletedLevel.toString());
}

// Show level select screen
function showLevelSelect() {
    document.getElementById('gameOver').style.display = 'none';
    const levelSelect = document.getElementById('levelSelect');
    const buttonsContainer = document.getElementById('levelButtons');
    buttonsContainer.innerHTML = '';

    LEVELS.forEach((level, index) => {
        const btn = document.createElement('button');
        btn.className = 'level-btn';
        btn.textContent = index + 1;
        btn.title = level.name;

        // Enable if level is unlocked (completed previous level or it's level 1)
        const isUnlocked = index <= gameState.highestCompletedLevel + 1;
        btn.disabled = !isUnlocked;

        if (isUnlocked) {
            btn.onclick = () => {
                levelSelect.style.display = 'none';
                startLevel(index);
            };
        }

        buttonsContainer.appendChild(btn);
    });

    levelSelect.style.display = 'block';
}

// Level Definitions
// y = distance from ground to bottom of obstacle (0 = on ground, 50 = floating 50px up)
let LEVELS = [
    {
        name: "Level 1 - Easy Start",
        obstacles: [
            { x: 500, y: 0, width: 30, height: 30, type: 'spike' },
            { x: 610, y: 0, width: 30, height: 30, type: 'spike' },
            { x: 810, y: 70, width: 80, height: 30, type: 'block' },
            { x: 1010, y: 0, width: 30, height: 30, type: 'spike' },
            { x: 1210, y: 0, width: 30, height: 30, type: 'spike' },
            { x: 1410, y: 0, width: 30, height: 60, type: 'block' }
        ],
        length: 1610
    },
    {
        name: "Level 2 - Timing Challenge",
        obstacles: [
            { x: 500, y: 0, width: 30, height: 30, type: 'spike' },
            { x: 610, y: 0, width: 30, height: 30, type: 'spike' },
            { x: 800, y: 0, width: 30, height: 100, type: 'block' },
            { x: 1000, y: 0, width: 30, height: 30, type: 'spike' },
            { x: 1030, y: 0, width: 30, height: 30, type: 'spike' },
            { x: 1250, y: 0, width: 30, height: 120, type: 'block' },
            { x: 1450, y: 0, width: 30, height: 30, type: 'spike' },
            { x: 1650, y: 0, width: 30, height: 30, type: 'spike' },
            { x: 1850, y: 0, width: 30, height: 80, type: 'block' }
        ],
        length: 2150
    },
    {
        name: "Level 3 - Expert",
        obstacles: [
            { x: 500, y: 0, width: 30, height: 30, type: 'spike' },
            { x: 580, y: 0, width: 30, height: 90, type: 'block' },
            { x: 750, y: 0, width: 30, height: 30, type: 'spike' },
            { x: 800, y: 0, width: 30, height: 30, type: 'spike' },
            { x: 900, y: 0, width: 30, height: 90, type: 'block' },
            { x: 1100, y: 0, width: 30, height: 30, type: 'spike' },
            { x: 1150, y: 0, width: 30, height: 30, type: 'spike' },
            { x: 1200, y: 0, width: 30, height: 30, type: 'spike' },
            { x: 1350, y: 0, width: 30, height: 100, type: 'block' },
            { x: 1500, y: 0, width: 30, height: 30, type: 'spike' },
            { x: 1600, y: 0, width: 30, height: 140, type: 'block' },
            { x: 1800, y: 0, width: 30, height: 30, type: 'spike' },
            { x: 1850, y: 0, width: 30, height: 30, type: 'spike' },
            { x: 2000, y: 0, width: 30, height: 30, type: 'spike' }
        ],
        length: 2500
    }
];

// Player Class
class Player {
    constructor() {
        this.x = 150;
        this.y = GAME_CONFIG.height - GAME_CONFIG.groundHeight - GAME_CONFIG.playerSize;
        this.width = GAME_CONFIG.playerSize;
        this.height = GAME_CONFIG.playerSize;
        this.velocityY = 0;
        this.isOnGround = false;
        this.rotation = 0;
    }

    jump() {
        if (this.isOnGround && !gameState.isGameOver) {
            this.velocityY = GAME_CONFIG.jumpForce;
            this.isOnGround = false;
        }
    }

    update() {
        // Apply gravity
        this.velocityY += GAME_CONFIG.gravity;
        this.y += this.velocityY;

        // Check obstacle collision and platform landing
        this.checkCollisions();

        // Ground collision
        const groundY = GAME_CONFIG.height - GAME_CONFIG.groundHeight - this.height;
        if (this.y >= groundY) {
            this.y = groundY;
            this.velocityY = 0;
            this.isOnGround = true;
            this.rotation = 0;
        } else if (!this.isOnGround) {
            // Rotate while in air
            this.rotation += 5;
        }
    }

    checkCollisions() {
        for (let obstacle of gameState.obstacles) {
            const rect = this.getObstacleRect(obstacle);

            if (!this.isCollidingWith(rect)) {
                continue;
            }

            // Spikes always end the game
            if (obstacle.type === 'spike') {
                gameOver();
                return;
            }

            // For blocks: ignore if player has already passed the block
            const playerCenter = this.x + this.width / 2;
            if (playerCenter > rect.right) {
                continue;
            }

            // For blocks, check if landing on top
            if (this.isLandingOnTop(rect)) {
                this.landOn(rect.top);
            } else {
                gameOver();
            }
            return;
        }

        // Not on any platform - check if in the air
        const groundY = GAME_CONFIG.height - GAME_CONFIG.groundHeight - this.height;
        if (this.y < groundY) {
            this.isOnGround = false;
        }
    }

    getObstacleRect(obstacle) {
        const screenX = obstacle.x - gameState.scrollOffset;
        // y is distance from ground to bottom of obstacle (0 = on ground)
        const bottom = GAME_CONFIG.height - GAME_CONFIG.groundHeight - obstacle.y;
        const top = bottom - obstacle.height;

        // Spikes have a smaller hitbox (triangular shape approximation)
        if (obstacle.type === 'spike') {
            const padding = obstacle.width * 0.25;
            return {
                left: screenX + padding,
                right: screenX + obstacle.width - padding,
                top: top + obstacle.height * 0.3,
                bottom: bottom
            };
        }

        return {
            left: screenX,
            right: screenX + obstacle.width,
            top: top,
            bottom: bottom
        };
    }

    isCollidingWith(rect) {
        const overlapX = this.x < rect.right && this.x + this.width > rect.left;
        const overlapY = this.y < rect.bottom && this.y + this.height > rect.top;
        return overlapX && overlapY;
    }

    isLandingOnTop(rect) {
        const overlapFromTop = (this.y + this.height) - rect.top;
        const overlapFromLeft = (this.x + this.width) - rect.left;
        const overlapFromRight = rect.right - this.x;

        // Landing if: falling down, just touched the top, and top overlap is smallest
        return this.velocityY > 0 &&
               overlapFromTop > 0 &&
               overlapFromTop < 15 &&
               overlapFromTop <= overlapFromLeft &&
               overlapFromTop <= overlapFromRight;
    }

    landOn(platformTop) {
        this.y = platformTop - this.height;
        this.velocityY = 0;
        this.isOnGround = true;
        this.rotation = 0;
    }

    draw(ctx) {
        ctx.save();
        ctx.translate(this.x + this.width / 2, this.y + this.height / 2);
        ctx.rotate(this.rotation * Math.PI / 180);

        // Draw player as a square
        ctx.fillStyle = GAME_CONFIG.playerColor;
        ctx.fillRect(-this.width / 2, -this.height / 2, this.width, this.height);

        // Draw eyes
        ctx.fillStyle = '#00FF00';
        ctx.fillRect(-this.width / 4, -this.height / 4, 8, 8);
        ctx.fillRect(this.width / 4 - 8, -this.height / 4, 8, 8);

        ctx.restore();
    }
}

// Initialize game
function initGame() {
    GAME_CONFIG.canvas = document.getElementById('gameCanvas');
    GAME_CONFIG.ctx = GAME_CONFIG.canvas.getContext('2d');

    // Set up event listeners
    document.addEventListener('keydown', (e) => {
        if (e.code === 'Space') {
            e.preventDefault();
            if (gameState.player) {
                gameState.player.jump();
            }
        }
    });

    GAME_CONFIG.canvas.addEventListener('click', () => {
        if (gameState.player) {
            gameState.player.jump();
        }
    });

    // Load code into editor
    loadCodeIntoEditor();

    // Load saved progress and start at highest unlocked level
    loadProgress();
    const startingLevel = Math.min(gameState.highestCompletedLevel + 1, LEVELS.length - 1);
    startLevel(startingLevel);
    gameLoop();
}

function startLevel(levelIndex) {
    if (levelIndex >= LEVELS.length) {
        levelIndex = 0; // Loop back to first level
    }

    gameState.currentLevel = levelIndex;
    const level = LEVELS[levelIndex];

    gameState.player = new Player();
    gameState.obstacles = JSON.parse(JSON.stringify(level.obstacles)); // Deep copy
    gameState.scrollOffset = 0;
    gameState.isGameOver = false;
    gameState.isWin = false;

    document.getElementById('gameOver').style.display = 'none';
}

function gameLoop() {
    update();
    draw();
    requestAnimationFrame(gameLoop);
}

function update() {
    if (!gameState.player || gameState.isGameOver || gameState.isWin) return;

    // Update player
    gameState.player.update();

    // Scroll the world
    gameState.scrollOffset += GAME_CONFIG.scrollSpeed;

    // Check if level complete
    const currentLevel = LEVELS[gameState.currentLevel];
    if (gameState.scrollOffset > currentLevel.length) {
        winLevel();
    }
}

function draw() {
    const ctx = GAME_CONFIG.ctx;

    // Clear canvas
    ctx.fillStyle = '#87CEEB';
    ctx.fillRect(0, 0, GAME_CONFIG.width, GAME_CONFIG.height);

    // Draw ground
    ctx.fillStyle = GAME_CONFIG.groundColor;
    ctx.fillRect(0, GAME_CONFIG.height - GAME_CONFIG.groundHeight, GAME_CONFIG.width, GAME_CONFIG.groundHeight);

    // Draw obstacles
    for (let obstacle of gameState.obstacles) {
        const screenX = obstacle.x - gameState.scrollOffset;
        // y is distance from ground to bottom of obstacle (0 = on ground)
        const obstacleY = GAME_CONFIG.height - GAME_CONFIG.groundHeight - obstacle.y - obstacle.height;

        // Only draw if on screen
        if (screenX + obstacle.width > 0 && screenX < GAME_CONFIG.width) {
            if (obstacle.type === 'spike') {
                drawSpike(ctx, screenX, obstacleY, obstacle.width, obstacle.height);
            } else if (obstacle.type === 'block') {
                drawBlock(ctx, screenX, obstacleY, obstacle.width, obstacle.height);
            }
        }
    }

    // Draw player
    if (gameState.player) {
        gameState.player.draw(ctx);
    }

    // Draw progress
    const currentLevel = LEVELS[gameState.currentLevel];
    const progress = Math.min(100, (gameState.scrollOffset / currentLevel.length) * 100);
    ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
    ctx.fillRect(10, 10, 200, 20);
    ctx.fillStyle = '#4CAF50';
    ctx.fillRect(10, 10, progress * 2, 20);
    ctx.strokeStyle = '#333';
    ctx.strokeRect(10, 10, 200, 20);

    // Draw level name
    ctx.fillStyle = 'white';
    ctx.font = 'bold 16px Arial';
    ctx.fillText(currentLevel.name, 10, 50);
}

function drawSpike(ctx, x, y, width, height) {
    ctx.fillStyle = GAME_CONFIG.obstacleColor;
    ctx.beginPath();
    ctx.moveTo(x, y + height);
    ctx.lineTo(x + width / 2, y);
    ctx.lineTo(x + width, y + height);
    ctx.closePath();
    ctx.fill();

    ctx.strokeStyle = '#500';
    ctx.lineWidth = 2;
    ctx.stroke();
}

function drawBlock(ctx, x, y, width, height) {
    // Draw main block with gradient
    const gradient = ctx.createLinearGradient(x, y, x + width, y + height);
    gradient.addColorStop(0, '#555');
    gradient.addColorStop(1, '#333');
    ctx.fillStyle = gradient;
    ctx.fillRect(x, y, width, height);

    // Draw border
    ctx.strokeStyle = '#222';
    ctx.lineWidth = 2;
    ctx.strokeRect(x, y, width, height);

    // Draw highlight on top edge
    ctx.strokeStyle = '#777';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.lineTo(x + width, y);
    ctx.stroke();
}

function gameOver() {
    gameState.isGameOver = true;
    setTimeout(() => {
        if (confirm('Game Over! Try again?')) {
            restartGame();
        }
    }, 100);
}

function winLevel() {
    gameState.isWin = true;

    // Update highest completed level if this is a new record
    if (gameState.currentLevel > gameState.highestCompletedLevel) {
        gameState.highestCompletedLevel = gameState.currentLevel;
        saveProgress();
    }

    document.getElementById('gameOver').style.display = 'block';
}

function restartGame() {
    startLevel(gameState.currentLevel);
}

function nextLevel() {
    startLevel(gameState.currentLevel + 1);
}
    </script>

    <script>
        // Inject game code - either custom or original
        (function() {
            const customCode = localStorage.getItem('mdash_custom_code');
            const originalCode = document.getElementById('originalGameCode').textContent;
            const codeToRun = customCode || originalCode;

            const script = document.createElement('script');
            script.id = 'gameCode';
            script.textContent = codeToRun;
            document.body.appendChild(script);
        })();

        // Code Editor Functions
        let codeEditor = null;
        let useCodeMirror = false;

        function getEditorValue() {
            if (useCodeMirror && codeEditor) {
                return codeEditor.getValue();
            }
            return document.getElementById('codeEditorFallback').value;
        }

        function setEditorValue(code) {
            if (useCodeMirror && codeEditor) {
                codeEditor.setValue(code);
            } else {
                document.getElementById('codeEditorFallback').value = code;
            }
        }

        function loadCodeIntoEditor() {
            const customCode = localStorage.getItem('mdash_custom_code');
            const originalCode = document.getElementById('originalGameCode').textContent;
            const code = customCode || originalCode;
            const container = document.getElementById('codeEditorContainer');

            // Try to use CodeMirror if available
            if (typeof CodeMirror !== 'undefined') {
                useCodeMirror = true;
                codeEditor = CodeMirror(container, {
                    value: code,
                    mode: 'javascript',
                    theme: 'dracula',
                    lineNumbers: true,
                    indentUnit: 4,
                    tabSize: 4,
                    indentWithTabs: false,
                    lineWrapping: true
                });
            } else {
                // Fallback to plain textarea
                useCodeMirror = false;
                const textarea = document.createElement('textarea');
                textarea.id = 'codeEditorFallback';
                textarea.value = code;
                container.appendChild(textarea);
            }
        }

        function resetCode() {
            if (confirm('Reset to original code? This will clear all your changes.')) {
                localStorage.removeItem('mdash_custom_code');
                location.reload();
            }
        }

        function toggleCodeDrawer() {
            const drawer = document.getElementById('codeDrawer');
            drawer.classList.toggle('open');
            // Refresh CodeMirror when drawer opens (fixes rendering issues)
            if (drawer.classList.contains('open') && useCodeMirror && codeEditor) {
                setTimeout(() => codeEditor.refresh(), 10);
            }
        }

        function applyCode() {
            const newCode = getEditorValue();

            try {
                // Save the new code to localStorage
                localStorage.setItem('mdash_custom_code', newCode);

                // Reload the page to apply changes with a clean slate
                location.reload();
            } catch (error) {
                alert('Error applying code: ' + error.message);
            }
        }

        // Level Editor Functions
        function toggleLevelDrawer() {
            const drawer = document.getElementById('levelDrawer');
            drawer.classList.toggle('open');
            if (drawer.classList.contains('open')) {
                loadLevelEditor();
            }
        }

        function loadLevelEditor() {
            const editor = document.getElementById('levelEditor');
            editor.innerHTML = '';

            LEVELS.forEach((level, index) => {
                const levelDiv = document.createElement('div');
                levelDiv.className = 'level-item';
                levelDiv.innerHTML = `
                    <h3>Level ${index + 1}: ${level.name}</h3>
                    <label>Name: <input type="text" value="${level.name}" id="levelName${index}" style="width: 100%; margin-bottom: 10px; padding: 5px;"></label>
                    <label>Length: <input type="number" value="${level.length}" id="levelLength${index}" style="width: 100%; margin-bottom: 10px; padding: 5px;"></label>
                    <label>Obstacles (JSON):</label>
                    <textarea id="levelData${index}">${JSON.stringify(level.obstacles, null, 2)}</textarea>
                    <button onclick="saveLevel(${index})">Save Level</button>
                    <button onclick="testLevel(${index})">Test Level</button>
                    ${index > 0 ? `<button onclick="deleteLevel(${index})" style="background: #f44336;">Delete</button>` : ''}
                `;
                editor.appendChild(levelDiv);
            });
        }

        function saveLevel(index) {
            try {
                const name = document.getElementById(`levelName${index}`).value;
                const length = parseInt(document.getElementById(`levelLength${index}`).value);
                const obstaclesJSON = document.getElementById(`levelData${index}`).value;
                const obstacles = JSON.parse(obstaclesJSON);

                LEVELS[index] = {
                    name: name,
                    length: length,
                    obstacles: obstacles
                };

                alert('Level saved!');
                loadLevelEditor();
            } catch (error) {
                alert('Error saving level: ' + error.message);
            }
        }

        function testLevel(index) {
            startLevel(index);
            toggleLevelDrawer();
        }

        function deleteLevel(index) {
            if (confirm('Are you sure you want to delete this level?')) {
                LEVELS.splice(index, 1);
                loadLevelEditor();
            }
        }

        function addNewLevel() {
            const newLevel = {
                name: `Level ${LEVELS.length + 1} - New Level`,
                obstacles: [
                    { x: 500, y: 0, width: 30, height: 30, type: 'spike' }
                ],
                length: 1500
            };
            LEVELS.push(newLevel);
            loadLevelEditor();
        }

        // Initialize game after all scripts are loaded
        window.addEventListener('DOMContentLoaded', () => {
            initGame();
        });
    </script>
</body>
</html>
