<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Variable Match - Code Quest</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Share+Tech+Mono&family=Fredoka:wght@400;500;600;700&display=swap');

    :root {
      --bg: #030310;
      --surface: #0d0d2b;
      --surface-light: #151538;
      --neon-cyan: #00f5ff;
      --neon-pink: #ff6b9d;
      --neon-yellow: #ffbe0b;
      --neon-green: #39ff14;
      --neon-red: #ff4444;
      --text: #cbcbe8;
      --text-dim: #7a7aba;
      --border: rgba(0, 245, 255, 0.2);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html { font-size: 16px; }
    @media (min-width: 1024px) { html { font-size: 20px; } }

    body {
      font-family: 'Fredoka', sans-serif;
      font-size: 1rem;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
      overflow-x: hidden;
    }

    /* Scanline overlay */
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background: repeating-linear-gradient(
        transparent, transparent 3px,
        rgba(0,0,0,0.035) 3px, rgba(0,0,0,0.035) 4px
      );
      pointer-events: none;
      z-index: 9999;
    }

    h1, h2, h3, h4 {
      font-family: 'Press Start 2P', monospace;
      font-weight: 400;
    }

    /* Back link */
    .back-link {
      align-self: flex-start;
      font-family: 'Press Start 2P', monospace;
      font-size: 0.6rem;
      color: var(--text-dim);
      text-decoration: none;
      padding: 6px 10px;
      border: 1px solid var(--border);
      border-radius: 3px;
      transition: all 0.15s;
      margin-bottom: 12px;
    }
    .back-link:hover {
      color: var(--neon-cyan);
      border-color: var(--neon-cyan);
    }

    /* Header */
    .game-header {
      text-align: center;
      margin-bottom: 16px;
    }
    .game-header h1 {
      font-size: 1.1rem;
      color: var(--neon-cyan);
      text-shadow: 0 0 10px var(--neon-cyan), 0 0 30px rgba(0,245,255,0.35);
      margin-bottom: 6px;
    }
    .game-header .level-label {
      font-family: 'Press Start 2P', monospace;
      font-size: 0.6rem;
      color: var(--neon-pink);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    /* HUD bar */
    .hud {
      display: flex;
      gap: 24px;
      justify-content: center;
      margin-bottom: 20px;
    }
    .hud-item {
      text-align: center;
      font-family: 'Press Start 2P', monospace;
      font-size: 0.55rem;
      color: var(--text-dim);
      line-height: 2;
      text-transform: uppercase;
    }
    .hud-item span {
      display: block;
      font-size: 0.9rem;
      color: var(--neon-yellow);
      text-shadow: 0 0 8px rgba(255,190,11,0.5);
    }

    /* Card grid */
    .card-grid {
      display: grid;
      grid-template-columns: repeat(4, 140px);
      grid-template-rows: repeat(3, 90px);
      gap: 12px;
      perspective: 800px;
      margin-bottom: 20px;
    }

    /* Individual card */
    .card {
      width: 140px;
      height: 90px;
      cursor: pointer;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.5s ease;
      -webkit-tap-highlight-color: transparent;
    }
    .card.flipped {
      transform: rotateY(180deg);
    }
    .card.matched {
      transform: rotateY(180deg);
      cursor: default;
    }
    .card.matched .card-back {
      border-color: var(--neon-green);
      box-shadow: 0 0 12px rgba(57, 255, 20, 0.4), 0 0 24px rgba(57, 255, 20, 0.15);
    }

    .card-face {
      position: absolute;
      inset: 0;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 8px;
      border: 2px solid var(--border);
    }

    /* Card front (face-down) */
    .card-front {
      background: var(--surface);
      /* Pixel grid pattern */
      background-image:
        linear-gradient(45deg, var(--surface-light) 25%, transparent 25%),
        linear-gradient(-45deg, var(--surface-light) 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, var(--surface-light) 75%),
        linear-gradient(-45deg, transparent 75%, var(--surface-light) 75%);
      background-size: 12px 12px;
      background-position: 0 0, 0 6px, 6px -6px, -6px 0;
      z-index: 2;
    }
    .card-front::after {
      content: '?';
      font-family: 'Press Start 2P', monospace;
      font-size: 1.4rem;
      color: var(--neon-cyan);
      text-shadow: 0 0 8px rgba(0, 245, 255, 0.5);
      position: absolute;
      background: var(--surface);
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 4px;
      border: 1px solid var(--border);
    }

    /* Card back (content) */
    .card-back {
      background: var(--surface-light);
      transform: rotateY(180deg);
      border-color: var(--neon-pink);
      transition: border-color 0.3s, box-shadow 0.3s;
    }
    .card-back.code-card {
      border-color: var(--neon-cyan);
    }
    .card-back.code-card .card-text {
      font-family: 'Share Tech Mono', monospace;
      font-size: 0.8rem;
      color: var(--neon-cyan);
      text-shadow: 0 0 6px rgba(0, 245, 255, 0.3);
    }
    .card-back.value-card {
      border-color: var(--neon-pink);
    }
    .card-back.value-card .card-text {
      font-family: 'Fredoka', sans-serif;
      font-size: 0.9rem;
      font-weight: 500;
      color: var(--neon-pink);
      text-shadow: 0 0 6px rgba(255, 107, 157, 0.3);
    }

    .card-text {
      text-align: center;
      word-break: break-word;
      line-height: 1.3;
    }

    .card-type-label {
      position: absolute;
      top: 4px;
      right: 6px;
      font-family: 'Press Start 2P', monospace;
      font-size: 0.45rem;
      text-transform: uppercase;
      opacity: 0.5;
    }
    .code-card .card-type-label { color: var(--neon-cyan); }
    .value-card .card-type-label { color: var(--neon-pink); }

    /* Win overlay */
    .win-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(3, 3, 16, 0.9);
      z-index: 100;
      align-items: center;
      justify-content: center;
      flex-direction: column;
    }
    .win-overlay.visible {
      display: flex;
    }

    .win-panel {
      background: var(--surface);
      border: 2px solid var(--neon-green);
      border-radius: 12px;
      padding: 32px 40px;
      text-align: center;
      box-shadow: 0 0 30px rgba(57, 255, 20, 0.2);
      max-width: 360px;
      width: 90%;
    }
    .win-panel h2 {
      font-size: 0.9rem;
      color: var(--neon-green);
      text-shadow: 0 0 10px var(--neon-green);
      margin-bottom: 20px;
    }

    .score-row {
      display: flex;
      justify-content: space-around;
      margin-bottom: 20px;
    }
    .score-item {
      text-align: center;
    }
    .score-item .label {
      font-family: 'Press Start 2P', monospace;
      font-size: 0.5rem;
      color: var(--text-dim);
      text-transform: uppercase;
      margin-bottom: 6px;
    }
    .score-item .value {
      font-family: 'Press Start 2P', monospace;
      font-size: 1.1rem;
      color: var(--neon-yellow);
      text-shadow: 0 0 8px rgba(255, 190, 11, 0.5);
    }

    .star-row {
      margin-bottom: 20px;
      font-size: 1.9rem;
      letter-spacing: 6px;
    }

    .btn-row {
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .btn {
      font-family: 'Press Start 2P', monospace;
      font-size: 0.65rem;
      padding: 10px 18px;
      border: 2px solid var(--neon-cyan);
      background: transparent;
      color: var(--neon-cyan);
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s;
      text-decoration: none;
      display: inline-block;
      line-height: 1.4;
    }
    .btn:hover {
      background: rgba(0, 245, 255, 0.1);
      box-shadow: 0 0 12px rgba(0, 245, 255, 0.3);
    }
    .btn.primary {
      border-color: var(--neon-green);
      color: var(--neon-green);
    }
    .btn.primary:hover {
      background: rgba(57, 255, 20, 0.1);
      box-shadow: 0 0 12px rgba(57, 255, 20, 0.3);
    }

    /* Shake animation for wrong match */
    @keyframes shake {
      0%, 100% { transform: rotateY(180deg) translateX(0); }
      20% { transform: rotateY(180deg) translateX(-5px); }
      40% { transform: rotateY(180deg) translateX(5px); }
      60% { transform: rotateY(180deg) translateX(-3px); }
      80% { transform: rotateY(180deg) translateX(3px); }
    }
    .card.wrong {
      animation: shake 0.4s ease;
    }
    .card.wrong .card-back {
      border-color: var(--neon-red) !important;
      box-shadow: 0 0 10px rgba(255, 68, 68, 0.4);
    }

    /* Pop animation for match */
    @keyframes pop {
      0% { transform: rotateY(180deg) scale(1); }
      50% { transform: rotateY(180deg) scale(1.08); }
      100% { transform: rotateY(180deg) scale(1); }
    }
    .card.pop {
      animation: pop 0.4s ease;
    }

    /* Responsive */
    @media (max-width: 620px) {
      .card-grid {
        grid-template-columns: repeat(3, 1fr);
        grid-template-rows: repeat(4, 80px);
        gap: 8px;
        width: 100%;
        max-width: 380px;
      }
      .card {
        width: 100%;
        height: 80px;
      }
      .card-back.code-card .card-text {
        font-size: 0.7rem;
      }
      .card-back.value-card .card-text {
        font-size: 0.8rem;
      }
      .game-header h1 {
        font-size: 0.8rem;
      }
    }
  </style>
</head>
<body>

  <a href="../code-quest.html" class="back-link">&larr; Code Quest</a>

  <div class="game-header">
    <h1>Variable Match</h1>
    <div class="level-label" id="levelLabel">Loading...</div>
  </div>

  <div class="hud">
    <div class="hud-item">
      Flips
      <span id="flipCount">0</span>
    </div>
    <div class="hud-item">
      Time
      <span id="timer">0:00</span>
    </div>
    <div class="hud-item">
      Pairs
      <span id="pairsLeft">6</span>
    </div>
  </div>

  <div class="card-grid" id="cardGrid"></div>

  <div class="win-overlay" id="winOverlay">
    <div class="win-panel">
      <h2>Nice Match!</h2>
      <div class="star-row" id="stars"></div>
      <div class="score-row">
        <div class="score-item">
          <div class="label">Flips</div>
          <div class="value" id="finalFlips">0</div>
        </div>
        <div class="score-item">
          <div class="label">Time</div>
          <div class="value" id="finalTime">0:00</div>
        </div>
      </div>
      <div class="btn-row">
        <button class="btn primary" id="playAgainBtn">Play Again</button>
        <a href="../code-quest.html" class="btn">&larr; Code Quest</a>
      </div>
    </div>
  </div>

<script>
  // ---- Card pair data ----
  const MATCH_PAIRS = {
    string: [
      { code: '"hello"', value: '"hello"' },
      { code: '42', value: '42 (number)' },
      { code: '"42"', value: '42 (string)' },
      { code: '"10" + "5"', value: '105 (string)' },
      { code: '"hi" + "!"', value: '"hi!"' },
      { code: '10 + 5', value: '15' },
      { code: '"a" + "b"', value: '"ab"' },
      { code: '3 + 7', value: '10' },
    ],
    variable: [
      { code: 'let score = 0', value: 'score is 0' },
      { code: 'let name = "Jo"', value: 'name is "Jo"' },
      { code: 'let isOn = true', value: 'isOn is true' },
      { code: 'let count = 2 + 3', value: 'count is 5' },
      { code: 'let happy = false', value: 'happy is false' },
      { code: 'let x = 7', value: 'x is 7' },
      { code: 'let color = "red"', value: 'color is "red"' },
      { code: 'let lives = 3', value: 'lives is 3' },
    ],
    operator: [
      { code: '10 + 3', value: '13' },
      { code: '10 % 3', value: '1' },
      { code: '4 * 5', value: '20' },
      { code: '15 / 3', value: '5' },
      { code: '20 - 8', value: '12' },
      { code: '2 * 2 * 2', value: '8' },
      { code: '9 + 1', value: '10' },
      { code: '100 / 10', value: '10' },
    ],
    comparison: [
      { code: '5 === 5', value: 'true' },
      { code: '5 > 10', value: 'false' },
      { code: '3 !== 4', value: 'true' },
      { code: '7 <= 7', value: 'true' },
      { code: '10 < 5', value: 'false' },
      { code: '8 >= 8', value: 'true' },
      { code: '1 === 2', value: 'false' },
      { code: '9 > 3', value: 'true' },
    ],
    assignment: [
      { code: 'let x = 5; x = 10', value: 'x is 10' },
      { code: 'let y = 3; y = y + 2', value: 'y is 5' },
      { code: 'let a = 1; a = a * 3', value: 'a is 3' },
      { code: 'let hp = 100; hp = hp - 40', value: 'hp is 60' },
      { code: 'let n = 0; n = 7', value: 'n is 7' },
      { code: 'let s = 2; s = s + s', value: 's is 4' },
      { code: 'let z = 10; z = z / 2', value: 'z is 5' },
      { code: 'let p = 1; p = p + 9', value: 'p is 10' },
    ],
    conditional: [
      { code: 'true && true', value: 'true' },
      { code: 'true && false', value: 'false' },
      { code: '5 > 3', value: 'true' },
      { code: '!(true)', value: 'false' },
      { code: '10 === 10', value: 'true' },
      { code: '3 > 7', value: 'false' },
      { code: 'true || false', value: 'true' },
      { code: '!(false)', value: 'true' },
    ],
  };

  // ---- State ----
  let currentLevel = 'variable';
  let cards = [];
  let flippedCards = [];
  let matchedPairs = 0;
  let flipCount = 0;
  let timerInterval = null;
  let startTime = null;
  let elapsedSeconds = 0;
  let lockBoard = false;

  // ---- Init ----
  function init() {
    const params = new URLSearchParams(window.location.search);
    const level = params.get('level');
    if (level && MATCH_PAIRS[level]) {
      currentLevel = level;
    }

    document.getElementById('levelLabel').textContent = currentLevel.charAt(0).toUpperCase() + currentLevel.slice(1) + ' Level';
    setupGame();
  }

  function setupGame() {
    // Reset state
    flippedCards = [];
    matchedPairs = 0;
    flipCount = 0;
    elapsedSeconds = 0;
    lockBoard = false;
    startTime = null;
    if (timerInterval) clearInterval(timerInterval);

    document.getElementById('flipCount').textContent = '0';
    document.getElementById('timer').textContent = '0:00';
    document.getElementById('pairsLeft').textContent = '6';
    document.getElementById('winOverlay').classList.remove('visible');

    // Pick 6 random pairs
    const allPairs = [...MATCH_PAIRS[currentLevel]];
    shuffle(allPairs);
    const selectedPairs = allPairs.slice(0, 6);

    // Create card objects: one code card and one value card per pair
    cards = [];
    selectedPairs.forEach((pair, i) => {
      cards.push({ id: i, type: 'code', text: pair.code, pairId: i });
      cards.push({ id: i, type: 'value', text: pair.value, pairId: i });
    });

    shuffle(cards);
    renderCards();
  }

  function renderCards() {
    const grid = document.getElementById('cardGrid');
    grid.innerHTML = '';

    cards.forEach((card, index) => {
      const el = document.createElement('div');
      el.className = 'card';
      el.dataset.index = index;

      el.innerHTML = `
        <div class="card-face card-front"></div>
        <div class="card-face card-back ${card.type}-card">
          <span class="card-type-label">${card.type === 'code' ? 'code' : 'value'}</span>
          <div class="card-text">${escapeHtml(card.text)}</div>
        </div>
      `;

      el.addEventListener('click', () => handleCardClick(index, el));
      grid.appendChild(el);
    });
  }

  function handleCardClick(index, el) {
    // Guard: locked board, already flipped, or already matched
    if (lockBoard) return;
    if (el.classList.contains('flipped')) return;
    if (el.classList.contains('matched')) return;
    // Don't allow clicking the same card twice
    if (flippedCards.length === 1 && flippedCards[0].index === index) return;

    // Start timer on first click
    if (startTime === null) {
      startTime = Date.now();
      timerInterval = setInterval(updateTimer, 200);
    }

    // Flip
    el.classList.add('flipped');
    flipCount++;
    document.getElementById('flipCount').textContent = flipCount;

    flippedCards.push({ index, el, card: cards[index] });

    if (flippedCards.length === 2) {
      checkMatch();
    }
  }

  function checkMatch() {
    const [a, b] = flippedCards;
    const isMatch = a.card.pairId === b.card.pairId && a.card.type !== b.card.type;

    if (isMatch) {
      // Match found
      a.el.classList.add('matched', 'pop');
      b.el.classList.add('matched', 'pop');
      matchedPairs++;
      document.getElementById('pairsLeft').textContent = 6 - matchedPairs;
      flippedCards = [];

      if (matchedPairs === 6) {
        setTimeout(showWin, 600);
      }
    } else {
      // No match
      lockBoard = true;
      a.el.classList.add('wrong');
      b.el.classList.add('wrong');

      setTimeout(() => {
        a.el.classList.remove('flipped', 'wrong');
        b.el.classList.remove('flipped', 'wrong');
        flippedCards = [];
        lockBoard = false;
      }, 1200);
    }
  }

  function updateTimer() {
    if (!startTime) return;
    elapsedSeconds = Math.floor((Date.now() - startTime) / 1000);
    const mins = Math.floor(elapsedSeconds / 60);
    const secs = elapsedSeconds % 60;
    document.getElementById('timer').textContent = mins + ':' + String(secs).padStart(2, '0');
  }

  function showWin() {
    clearInterval(timerInterval);
    updateTimer();

    const mins = Math.floor(elapsedSeconds / 60);
    const secs = elapsedSeconds % 60;
    const timeStr = mins + ':' + String(secs).padStart(2, '0');

    document.getElementById('finalFlips').textContent = flipCount;
    document.getElementById('finalTime').textContent = timeStr;

    // Star rating: based on flips (6 pairs, minimum 12 flips)
    let starCount;
    if (flipCount <= 14) {
      starCount = 3;
    } else if (flipCount <= 20) {
      starCount = 2;
    } else {
      starCount = 1;
    }

    const starEl = document.getElementById('stars');
    starEl.textContent = '';
    for (let i = 0; i < 3; i++) {
      const span = document.createElement('span');
      span.textContent = i < starCount ? '\u2B50' : '\u2606';
      span.style.opacity = i < starCount ? '1' : '0.3';
      starEl.appendChild(span);
    }

    document.getElementById('winOverlay').classList.add('visible');
  }

  // ---- Utilities ----
  function shuffle(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  // ---- Event listeners ----
  document.getElementById('playAgainBtn').addEventListener('click', setupGame);

  // ---- Start ----
  init();
</script>

</body>
</html>
