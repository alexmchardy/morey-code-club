<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ugrok</title>
  <link rel="stylesheet" href="shared.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/material-darker.min.css">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
</head>
<body>

  <!-- Landing Screen -->
  <div id="landingScreen" class="landing-screen">
    <h1>ugrok</h1>
    <p class="tagline">See how your code really runs</p>
    <div class="grokset-list" id="groksetList">
      <!-- Grokset cards rendered by renderLanding() -->
    </div>
  </div>

  <!-- Exercise Screen -->
  <div id="exerciseScreen" class="exercise-screen hidden">
    <!-- Top bar -->
    <div class="top-bar">
      <button class="back-btn" id="backBtn">&#8592; MENU</button>
      <span class="top-bar-title" id="exerciseTitle"></span>
      <span class="exercise-counter" id="exerciseCounter"></span>
    </div>

    <!-- Progress dots -->
    <div class="progress-dots" id="progressDots"></div>

    <!-- Exercise content -->
    <div class="exercise-content" id="exerciseContent"></div>
  </div>

  <!-- Help button (hidden until exercise screen is active) -->
  <button class="help-btn hidden" id="helpBtn">?</button>

  <!-- Help panel (hidden by default) -->
  <div class="help-panel hidden" id="helpPanel">
    <div class="help-panel-title">ASK FOR HELP</div>
    <textarea class="help-textarea" id="helpTextarea" placeholder="What are you confused about?"></textarea>
    <button class="help-ask-btn" id="helpAskBtn">ASK</button>
    <div class="help-cooldown hidden" id="helpCooldown"></div>
    <div class="help-response hidden" id="helpResponse"></div>
  </div>

  <!-- Wrong-answer nudge bubble -->
  <div class="wrong-help-bubble hidden" id="wrongHelpBubble"></div>

  <!-- Scripts: Skulpt -->
  <script src="https://cdn.jsdelivr.net/npm/skulpt@1.2.0/dist/skulpt.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/skulpt@1.2.0/dist/skulpt-stdlib.js"></script>

  <!-- Scripts: CodeMirror -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/python/python.min.js"></script>

  <script>
    // ============================================================
    // GROKSET MANIFEST
    // ============================================================
    const GROKSET_MANIFEST = [
      { id: 'variables',    file: 'groksets/variables.json' },
      { id: 'operators',    file: 'groksets/operators.json' },
      { id: 'comparisons',  file: 'groksets/comparisons.json' },
      { id: 'conditionals', file: 'groksets/conditionals.json' },
      { id: 'loops',        file: 'groksets/loops.json' },
      { id: 'nesting',      file: 'groksets/nesting.json' },
      { id: 'functions',    file: 'groksets/functions.json' },
    ];

    const CEREBRAS_API_KEY = 'csk-p9853f3f4hfhrkhdfdxwmpehec9dv3hfnj2r36mmtexnk3wj';

    // ============================================================
    // STATE
    // ============================================================
    let currentGrokset = null;       // loaded grokset JSON object
    let currentExerciseIndex = 0;    // 0-based index within grokset
    let groksetCache = {};           // id -> grokset JSON
    let quizEditor = null;           // CodeMirror instance for quiz-code exercises
    let quizRunning = false;         // prevents re-entrant runs in quiz-code exercises
    let lastQuizError = null;        // last Python error from a quiz-code run, for help context
    let maxReachedIndex = 0;         // furthest exercise index visited in current grokset

    // ============================================================
    // LOCALSTORAGE HELPERS
    // ============================================================

    function progressKey(groksetId) {
      return `ugrok_progress_${groksetId}`;
    }

    function codeKey(groksetId, exerciseIndex) {
      return `ugrok_code_${groksetId}_${exerciseIndex}`;
    }

    /**
     * Load progress for a grokset.
     * Returns an array of booleans, one per exercise (true = completed).
     * Length is padded/trimmed to match exerciseCount if provided.
     */
    function loadProgress(groksetId, exerciseCount) {
      const raw = localStorage.getItem(progressKey(groksetId));
      let arr;
      try {
        arr = raw ? JSON.parse(raw) : [];
        if (!Array.isArray(arr)) arr = [];
      } catch { arr = []; }
      if (exerciseCount !== undefined) {
        while (arr.length < exerciseCount) arr.push(false);
        arr = arr.slice(0, exerciseCount);
      }
      return arr;
    }

    function saveProgress(groksetId, progressArr) {
      localStorage.setItem(progressKey(groksetId), JSON.stringify(progressArr));
    }

    /**
     * Returns a summary { done, total } for a grokset.
     * Uses cached grokset if available, otherwise just reads stored progress length.
     */
    function getGroksetProgress(groksetId) {
      const gs = groksetCache[groksetId];
      if (!gs || !gs.exercises) return null;
      const total = gs.exercises.length;
      const arr = loadProgress(groksetId, total);
      const done = arr.filter(Boolean).length;
      return { done, total };
    }

    function markExerciseComplete(groksetId, exerciseIndex) {
      const gs = groksetCache[groksetId];
      if (!gs) return;
      const arr = loadProgress(groksetId, gs.exercises.length);
      arr[exerciseIndex] = true;
      saveProgress(groksetId, arr);
    }

    function saveStudentCode(groksetId, exerciseIndex, code) {
      localStorage.setItem(codeKey(groksetId, exerciseIndex), code);
    }

    function loadStudentCode(groksetId, exerciseIndex) {
      return localStorage.getItem(codeKey(groksetId, exerciseIndex)) || null;
    }

    // ============================================================
    // FETCH GROKSET
    // ============================================================

    async function fetchGrokset(entry) {
      if (groksetCache[entry.id]) return groksetCache[entry.id];
      try {
        const res = await fetch(entry.file);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        groksetCache[entry.id] = data;
        return data;
      } catch (e) {
        // Return a minimal stub so the card can still render
        const stub = {
          id: entry.id,
          title: entry.id,
          description: '',
          exercises: [],
          _stub: true,
        };
        groksetCache[entry.id] = stub;
        return stub;
      }
    }

    // ============================================================
    // FIND SUGGESTED GROKSET
    // ============================================================

    /**
     * Returns the index in GROKSET_MANIFEST of the first grokset that:
     *  - has at least one exercise (not a stub)
     *  - is not fully completed
     * Falls back to 0 if everything is complete or all are stubs.
     */
    function findSuggestedIndex() {
      for (let i = 0; i < GROKSET_MANIFEST.length; i++) {
        const entry = GROKSET_MANIFEST[i];
        const gs = groksetCache[entry.id];
        if (!gs || gs._stub || gs.exercises.length === 0) continue;
        const p = getGroksetProgress(entry.id);
        if (p && p.done < p.total) return i;
      }
      // If all with exercises are done, suggest first one with exercises
      for (let i = 0; i < GROKSET_MANIFEST.length; i++) {
        const gs = groksetCache[GROKSET_MANIFEST[i].id];
        if (gs && !gs._stub && gs.exercises.length > 0) return i;
      }
      return 0;
    }

    // ============================================================
    // RENDER LANDING
    // ============================================================

    async function renderLanding() {
      const list = document.getElementById('groksetList');
      list.innerHTML = '<div style="font-family:\'Share Tech Mono\',monospace;font-size:13px;color:var(--text-dim);text-align:center;padding:20px;">Loading...</div>';

      // Fetch all groksets (in parallel)
      await Promise.all(GROKSET_MANIFEST.map(e => fetchGrokset(e)));

      const suggestedIdx = findSuggestedIndex();

      list.innerHTML = '';

      GROKSET_MANIFEST.forEach((entry, idx) => {
        const gs = groksetCache[entry.id];
        const isStub = !gs || gs._stub || gs.exercises.length === 0;
        const p = isStub ? null : getGroksetProgress(entry.id);
        const isComplete = p && p.done === p.total;
        const isSuggested = !isStub && idx === suggestedIdx;

        const card = document.createElement('div');
        card.className = 'grokset-card'
          + (isSuggested ? ' suggested' : '')
          + (isComplete ? ' complete' : '')
          + (isStub ? ' stub' : '');

        // Number
        const numEl = document.createElement('div');
        numEl.className = 'grokset-number';
        numEl.textContent = idx + 1;
        card.appendChild(numEl);

        // Info
        const info = document.createElement('div');
        info.className = 'grokset-info';

        const title = document.createElement('div');
        title.className = 'grokset-title';
        title.textContent = gs && gs.title ? gs.title : entry.id;
        info.appendChild(title);

        if (gs && gs.description) {
          const desc = document.createElement('div');
          desc.className = 'grokset-desc';
          desc.textContent = gs.description;
          info.appendChild(desc);
        }

        card.appendChild(info);

        // Progress / badge
        if (isStub) {
          const badge = document.createElement('div');
          badge.className = 'coming-soon-badge';
          badge.textContent = 'Coming soon';
          card.appendChild(badge);
        } else if (isComplete) {
          const prog = document.createElement('div');
          prog.className = 'grokset-progress done';
          prog.textContent = '✓ Done';
          card.appendChild(prog);
        } else if (p && p.done > 0) {
          const prog = document.createElement('div');
          prog.className = 'grokset-progress in-progress';
          prog.textContent = `${p.done}/${p.total}`;
          card.appendChild(prog);
        } else if (p) {
          const prog = document.createElement('div');
          prog.className = 'grokset-progress';
          prog.textContent = `0/${p.total}`;
          card.appendChild(prog);
        }

        if (!isStub) {
          card.addEventListener('click', () => startGrokset(entry.id));
        }

        list.appendChild(card);
      });
    }

    // ============================================================
    // START GROKSET
    // ============================================================

    async function startGrokset(groksetId) {
      const manifest = GROKSET_MANIFEST.find(m => m.id === groksetId);
      if (!manifest) return;
      currentGrokset = await fetchGrokset(manifest);
      const prog = getGroksetProgress(groksetId);
      // Resume at next incomplete exercise, or 0 if all done
      if (prog) {
        const progressArr = loadProgress(groksetId, currentGrokset.exercises.length);
        const firstIncomplete = progressArr.findIndex(v => !v);
        currentExerciseIndex = firstIncomplete >= 0 ? firstIncomplete : 0;
      } else {
        currentExerciseIndex = 0;
      }
      maxReachedIndex = currentExerciseIndex;

      document.getElementById('landingScreen').classList.add('hidden');
      document.getElementById('exerciseScreen').classList.remove('hidden');
      document.getElementById('helpBtn').classList.remove('hidden');
      document.getElementById('exerciseTitle').textContent = currentGrokset.title;

      renderExercise();
    }

    // ============================================================
    // RENDER EXERCISE
    // ============================================================

    function showWrongBubble() {
      let explanationIdx = -1;
      for (let i = currentExerciseIndex - 1; i >= 0; i--) {
        const t = currentGrokset.exercises[i].type;
        if (t === 'explanation' || t === 'stepper') { explanationIdx = i; break; }
      }

      const bubble = document.getElementById('wrongHelpBubble');
      bubble.innerHTML = (explanationIdx >= 0
        ? `<button class="wrong-bubble-review-btn" id="wrongBubbleReviewBtn">&#x21E6; See explanation again</button>`
        : '')
        + `<div class="wrong-bubble-help-hint">&#x2193; Ask for help below</div>`;

      if (explanationIdx >= 0) {
        document.getElementById('wrongBubbleReviewBtn').addEventListener('click', () => {
          currentExerciseIndex = explanationIdx;
          hideWrongBubble();
          renderExercise();
        });
      }
      bubble.classList.remove('hidden');
    }

    function hideWrongBubble() {
      document.getElementById('wrongHelpBubble').classList.add('hidden');
    }

    function renderExercise() {
      if (quizEditor) { quizEditor.toTextArea(); quizEditor = null; }
      lastQuizError = null;
      hideWrongBubble();
      const exercise = currentGrokset.exercises[currentExerciseIndex];
      const total = currentGrokset.exercises.length;
      const progressArr = loadProgress(currentGrokset.id, total);

      // Counter
      document.getElementById('exerciseCounter').textContent = `${currentExerciseIndex + 1} of ${total}`;

      // Progress dots
      if (currentExerciseIndex > maxReachedIndex) maxReachedIndex = currentExerciseIndex;

      const dotsContainer = document.getElementById('progressDots');
      dotsContainer.innerHTML = '';
      for (let i = 0; i < total; i++) {
        const dot = document.createElement('span');
        dot.className = 'progress-dot';
        if (progressArr[i]) dot.classList.add('completed');
        if (i <= maxReachedIndex) {
          dot.classList.add('reachable');
          dot.addEventListener('click', () => goToExercise(i));
        }
        if (i === currentExerciseIndex) dot.classList.add('current');
        dotsContainer.appendChild(dot);
      }

      // Help panel reset
      document.getElementById('helpPanel').classList.add('hidden');
      document.getElementById('helpResponse').textContent = '';
      document.getElementById('helpResponse').classList.add('hidden');
      document.getElementById('helpTextarea').value = '';

      // Render by type
      const content = document.getElementById('exerciseContent');
      content.innerHTML = '';

      switch (exercise.type) {
        case 'explanation': renderExplanation(content, exercise); break;
        case 'stepper': renderStepper(content, exercise); break;
        case 'quiz-choice': renderQuizChoice(content, exercise); break;
        case 'quiz-code': renderQuizCode(content, exercise); break;
      }
    }

    // ============================================================
    // NAVIGATION HELPERS
    // ============================================================

    function goToExercise(index) {
      if (index < 0 || index >= currentGrokset.exercises.length) return;
      currentExerciseIndex = index;
      renderExercise();
    }

    function advanceExercise() {
      markExerciseComplete(currentGrokset.id, currentExerciseIndex);
      if (currentExerciseIndex + 1 >= currentGrokset.exercises.length) {
        renderCelebration();
        sounds.complete();
      } else {
        currentExerciseIndex++;
        renderExercise();
      }
    }

    function renderCelebration() {
      document.getElementById('helpBtn').classList.add('hidden');
      document.getElementById('progressDots').innerHTML = '';
      document.getElementById('exerciseCounter').textContent = '';

      const content = document.getElementById('exerciseContent');
      content.innerHTML = `
        <div class="celebration-screen">
          <h2 class="celebration-title">GROKSET COMPLETE!</h2>
          <p>You finished ${currentGrokset.title}!</p>
          <button class="celebration-back-btn" id="celebrationBackBtn">BACK TO MENU</button>
        </div>
      `;
      document.getElementById('celebrationBackBtn').addEventListener('click', () => {
        document.getElementById('backBtn').click();
      });

      const defaults = { startVelocity: 30, spread: 70, ticks: 80, zIndex: 10000 };
      confetti({ ...defaults, particleCount: 80, origin: { x: 0.15, y: 0.6 }, angle: 60 });
      confetti({ ...defaults, particleCount: 80, origin: { x: 0.85, y: 0.6 }, angle: 120 });
      setTimeout(() => {
        confetti({ ...defaults, particleCount: 50, origin: { x: 0.5, y: 0.3 }, angle: 90, spread: 120 });
      }, 300);
    }

    // ============================================================
    // SKULPT EXECUTION
    // ============================================================

    function builtinRead(filename) {
      if (Sk.builtinFiles === undefined || Sk.builtinFiles["files"][filename] === undefined) {
        throw "File not found: '" + filename + "'";
      }
      return Sk.builtinFiles["files"][filename];
    }

    async function runPython(code) {
      const output = [];
      Sk.configure({
        output: (text) => output.push(text),
        read: builtinRead,
        __future__: Sk.python3,
      });
      Sk.execLimit = 5000;

      try {
        const module = await Sk.misceval.asyncToPromise(() => {
          return Sk.importMainWithBody("<stdin>", false, code, true);
        });

        const state = {};
        for (const key of Object.keys(module.$d)) {
          if (key.startsWith('__')) continue;
          try {
            state[key] = Sk.ffi.remapToJs(module.$d[key]);
          } catch {
            state[key] = String(module.$d[key]);
          }
        }

        return { success: true, output, state, error: null };
      } catch (err) {
        return { success: false, output, state: {}, error: err.toString() };
      }
    }

    // ============================================================
    // EXPLANATION RENDERER
    // ============================================================

    function escapeHTML(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    function renderExplanation(container, exercise) {
      const lines = exercise.code.split('\n');
      const highlights = exercise.highlights || [];

      // Map line numbers to their highlight group index
      const lineToGroup = {};
      highlights.forEach((h, gi) => h.lines.forEach(l => { lineToGroup[l] = gi; }));

      const codeHTML = lines.map((line, i) => {
        const lineNum = i + 1;
        const gi = lineToGroup[lineNum];
        if (gi !== undefined) {
          const groupLines = highlights[gi].lines;
          const isFirst = lineNum === groupLines[0];
          const isLast = lineNum === groupLines[groupLines.length - 1];
          const extra = (isFirst ? ' group-start' : '') + (isLast ? ' group-end' : '');
          const badge = isFirst ? `<span class="highlight-badge">${gi + 1}</span>` : '';
          return `<span class="code-line highlighted${extra}" data-group="${gi}">${badge}${escapeHTML(line) || ' '}</span>`;
        }
        return `<span class="code-line">${escapeHTML(line) || ' '}</span>`;
      }).join('\n');

      const notesHTML = highlights.map((h, gi) =>
        `<div class="highlight-note" data-group="${gi}"><span class="highlight-badge">${gi + 1}</span>${escapeHTML(h.note)}</div>`
      ).join('');

      container.innerHTML = `
        <div class="explanation-layout" id="explanationLayout">
          <div class="explanation-code-panel">
            <div class="code-font">${codeHTML}</div>
          </div>
          <div class="explanation-text-panel">
            <p>${exercise.content}</p>
            ${notesHTML}
          </div>
        </div>
        <button class="got-it-btn" id="gotItBtn">GOT IT</button>
      `;

      // Interactive highlight pairing
      const layout = document.getElementById('explanationLayout');
      const allCodeLines = layout.querySelectorAll('.code-line.highlighted');
      const allNotes = layout.querySelectorAll('.highlight-note');

      function setFocus(groupIndex) {
        layout.classList.add('has-focus');
        allCodeLines.forEach(el => el.classList.toggle('focus', el.dataset.group == groupIndex));
        allNotes.forEach(el => el.classList.toggle('focus', el.dataset.group == groupIndex));
      }

      function clearFocus() {
        layout.classList.remove('has-focus');
        allCodeLines.forEach(el => el.classList.remove('focus'));
        allNotes.forEach(el => el.classList.remove('focus'));
      }

      allCodeLines.forEach(el => {
        el.addEventListener('mouseenter', () => setFocus(el.dataset.group));
        el.addEventListener('mouseleave', clearFocus);
      });
      allNotes.forEach(el => {
        el.addEventListener('mouseenter', () => setFocus(el.dataset.group));
        el.addEventListener('mouseleave', clearFocus);
      });

      document.getElementById('gotItBtn').addEventListener('click', advanceExercise);
    }

    // ============================================================
    // STUB RENDERERS (to be implemented in later tasks)
    // ============================================================

    function renderStepper(container, exercise) {
      const lines = exercise.code.split('\n');
      const trace = exercise.trace;
      let stepIndex = -1;  // -1 means "before first step"

      // Build code HTML with line numbers
      const codeHTML = lines.map((line, i) => {
        const lineNum = i + 1;
        return `<div class="stepper-code-line" data-line="${lineNum}">
          <span class="stepper-line-num">${lineNum}</span>
          <span class="stepper-line-text">${escapeHTML(line) || ' '}</span>
        </div>`;
      }).join('');

      container.innerHTML = `
        <h3 style="font-size:0.7rem; margin-bottom:12px; color:var(--primary); font-family:'Press Start 2P',monospace;">${escapeHTML(exercise.title || 'Watch It Run')}</h3>
        <div class="stepper-layout">
          <div class="stepper-code-panel">
            <pre>${codeHTML}</pre>
            <div class="stepper-controls">
              <button class="stepper-btn stepper-reset" id="stepResetBtn" title="Reset">⏮</button>
              <button class="stepper-btn" id="stepBackBtn" title="Step Back">◀</button>
              <button class="stepper-btn" id="stepFwdBtn" title="Step Forward">▶</button>
            </div>
            <button class="got-it-btn" id="stepDoneBtn" style="margin-top:16px;" disabled>GOT IT</button>
          </div>
          <div class="stepper-right-panel">
            <div class="stepper-section">
              <div class="stepper-section-title">VARIABLES</div>
              <table class="stepper-vars-table" id="stepperVars"><tbody></tbody></table>
            </div>
            <div class="stepper-section">
              <div class="stepper-section-title">EVALUATION</div>
              <div class="stepper-eval" id="stepperEval"></div>
            </div>
            <div class="stepper-section">
              <div class="stepper-section-title">OUTPUT</div>
              <div class="stepper-output" id="stepperOutput"></div>
            </div>
          </div>
        </div>
      `;

      const varsEl = document.getElementById('stepperVars').querySelector('tbody');
      const evalEl = document.getElementById('stepperEval');
      const outputEl = document.getElementById('stepperOutput');
      const backBtn = document.getElementById('stepBackBtn');
      const fwdBtn = document.getElementById('stepFwdBtn');
      const resetBtn = document.getElementById('stepResetBtn');
      const doneBtn = document.getElementById('stepDoneBtn');

      function updateDisplay() {
        // Highlight current line, dim executed lines
        const codeLines = container.querySelectorAll('.stepper-code-line');
        codeLines.forEach(el => {
          const ln = parseInt(el.dataset.line);
          el.classList.remove('current', 'executed');
          if (stepIndex >= 0) {
            const currentLine = trace[stepIndex].line;
            if (ln === currentLine) {
              el.classList.add('current');
            } else {
              const executedLines = new Set(trace.slice(0, stepIndex).map(s => s.line));
              if (executedLines.has(ln)) el.classList.add('executed');
            }
          }
        });

        // Variables table
        varsEl.innerHTML = '';
        if (stepIndex >= 0) {
          const state = trace[stepIndex].state;
          const prevState = stepIndex > 0 ? trace[stepIndex - 1].state : {};
          for (const [name, value] of Object.entries(state)) {
            const changed = prevState[name] === undefined || prevState[name] !== value;
            const tr = document.createElement('tr');
            tr.innerHTML = `<td class="var-name">${escapeHTML(name)}</td><td class="var-value${changed ? ' flash' : ''}">${escapeHTML(JSON.stringify(value))}</td>`;
            varsEl.appendChild(tr);
          }
        }

        // Evaluation
        evalEl.textContent = (stepIndex >= 0 && trace[stepIndex].eval) ? trace[stepIndex].eval : '';

        // Output
        if (stepIndex >= 0) {
          const output = trace[stepIndex].output;
          const prevOutput = stepIndex > 0 ? trace[stepIndex - 1].output : [];
          outputEl.innerHTML = output.map((line, i) => {
            const isNew = i >= prevOutput.length;
            return `<div class="${isNew ? 'output-new' : ''}">${escapeHTML(line)}</div>`;
          }).join('');
        } else {
          outputEl.textContent = '';
        }

        // Button states
        backBtn.disabled = stepIndex <= -1;
        fwdBtn.disabled = stepIndex >= trace.length - 1;
        resetBtn.disabled = stepIndex <= -1;
        doneBtn.disabled = stepIndex < trace.length - 1;
      }

      function stepForward() {
        if (stepIndex < trace.length - 1) {
          stepIndex++;
          sounds.step();
          updateDisplay();
        }
      }

      function stepBack() {
        if (stepIndex > -1) {
          stepIndex--;
          updateDisplay();
        }
      }

      function resetStepper() {
        stepIndex = -1;
        updateDisplay();
      }

      fwdBtn.addEventListener('click', stepForward);
      backBtn.addEventListener('click', stepBack);
      resetBtn.addEventListener('click', resetStepper);
      document.getElementById('stepDoneBtn').addEventListener('click', advanceExercise);

      updateDisplay();
    }

    function renderQuizChoice(container, exercise) {
      const codeSection = exercise.code
        ? `<div class="quiz-code"><pre class="code-font">${escapeHTML(exercise.code)}</pre></div>`
        : '';

      const choicesHTML = exercise.choices.map((choice, i) =>
        `<button class="choice-btn" data-index="${i}">${escapeHTML(choice)}</button>`
      ).join('');

      container.innerHTML = `
        <p class="quiz-question">${escapeHTML(exercise.question)}</p>
        ${codeSection}
        <div class="quiz-choices">${choicesHTML}</div>
        <div class="quiz-feedback" id="quizFeedback"></div>
      `;

      let answered = false;
      container.querySelectorAll('.choice-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          if (answered) return;
          const index = parseInt(btn.dataset.index);
          if (index === exercise.answer) {
            answered = true;
            btn.classList.add('correct');
            sounds.correct();
            hideWrongBubble();
            document.getElementById('quizFeedback').innerHTML =
              '<span style="color:var(--secondary)">Correct!</span>';
            setTimeout(advanceExercise, 3000);
          } else {
            btn.classList.add('wrong');
            sounds.wrong();
            document.getElementById('quizFeedback').innerHTML =
              '<span style="color:var(--error)">Not quite — try again!</span>';
            showWrongBubble();
            setTimeout(() => {
              btn.classList.remove('wrong');
              document.getElementById('quizFeedback').textContent = '';
            }, 2000);
          }
        });
      });
    }

    function renderQuizCode(container, exercise) {
      const savedCode = loadStudentCode(currentGrokset.id, currentExerciseIndex);

      container.innerHTML = `
        <div class="quiz-code-layout">
          <p class="quiz-question">${escapeHTML(exercise.question)}</p>
          <div class="quiz-code-editor-wrap">
            <textarea class="quiz-code-area" id="quizCodeArea">${savedCode || exercise.starterCode}</textarea>
          </div>
          <button class="run-btn" id="quizRunBtn">RUN</button>
          <div class="code-result" id="quizResult" style="display:none"></div>
          <div class="quiz-feedback" id="quizFeedback"></div>
          <button class="got-it-btn hidden" id="quizDoneBtn">GOT IT</button>
        </div>
      `;

      function insertSpacesTab(cm) {
        if (cm.somethingSelected()) { cm.indentSelection('add'); return; }
        cm.replaceSelection(' '.repeat(cm.getOption('indentUnit') || 4), 'end', '+input');
      }
      function dedentWhitespaceBeforeCursor(cm) {
        const cur = cm.getCursor(), line = cm.getLine(cur.line), ch = cur.ch;
        if (ch === 0) return CodeMirror.Pass;
        const prefix = line.slice(0, ch);
        if (!/^\s+$/.test(prefix)) return CodeMirror.Pass;
        const unit = cm.getOption('indentUnit') || 4;
        const targetCh = Math.floor((ch - 1) / unit) * unit;
        if (targetCh >= ch) return CodeMirror.Pass;
        cm.replaceRange('', { line: cur.line, ch: targetCh }, { line: cur.line, ch });
        cm.setCursor({ line: cur.line, ch: targetCh });
      }

      quizEditor = CodeMirror.fromTextArea(document.getElementById('quizCodeArea'), {
        mode: 'python',
        theme: 'material-darker',
        lineNumbers: true,
        indentUnit: 4,
        tabSize: 4,
        indentWithTabs: false,
        viewportMargin: Infinity, // Enables autosizing editor
        extraKeys: {
          Tab: insertSpacesTab,
          Backspace: dedentWhitespaceBeforeCursor,
          'Shift-Tab': 'indentLess',
          'Ctrl-Enter': () => document.getElementById('quizRunBtn').click(),
          'Cmd-Enter': () => document.getElementById('quizRunBtn').click(),
        },
      });

      quizEditor.on('change', () => {
        saveStudentCode(currentGrokset.id, currentExerciseIndex, quizEditor.getValue());
      });

      document.getElementById('quizDoneBtn').addEventListener('click', advanceExercise);

      document.getElementById('quizRunBtn').addEventListener('click', async () => {
        if (quizRunning) return;
        quizRunning = true;

        const runBtn = document.getElementById('quizRunBtn');
        runBtn.disabled = true;

        // Yield to the browser so it can paint the disabled state and drain
        // any click events already queued before we set the flag.
        await new Promise(r => setTimeout(r, 0));

        const code = quizEditor.getValue();
        saveStudentCode(currentGrokset.id, currentExerciseIndex, code);

        const resultEl = document.getElementById('quizResult');
        const feedbackEl = document.getElementById('quizFeedback');
        resultEl.style.display = '';
        feedbackEl.textContent = '';
        feedbackEl.className = 'quiz-feedback';

        const result = await runPython(code);
        runBtn.disabled = false;
        setTimeout(() => { quizRunning = false; }, 0);

        if (!result.success) {
          lastQuizError = result.error;
          resultEl.textContent = result.error;
          feedbackEl.textContent = 'Error running your code';
          feedbackEl.classList.add('wrong');
          sounds.wrong();
          showWrongBubble();
          return;
        }

        lastQuizError = null;

        const validation = exercise.validation;
        let passed = false;

        if (validation.type === 'output') {
          const actualOutput = result.output.join('').split('\n').filter(l => l.length > 0);
          const expected = validation.expected;
          passed = expected.length === actualOutput.length &&
            expected.every((exp, i) => actualOutput[i] === exp);

          resultEl.textContent = `Output: ${actualOutput.join(', ') || '(nothing)'}`;
          if (!passed) {
            resultEl.textContent += `\nExpected: ${expected.join(', ')}`;
          }
        } else if (validation.type === 'state') {
          passed = true;
          const lines = [];
          for (const [varName, expected] of Object.entries(validation.check)) {
            const actual = result.state[varName];
            if (actual !== expected) {
              passed = false;
              lines.push(`${varName} = ${JSON.stringify(actual)} (expected ${JSON.stringify(expected)})`);
            } else {
              lines.push(`${varName} = ${JSON.stringify(actual)} ✓`);
            }
          }
          resultEl.textContent = lines.join('\n');
        }

        if (passed) {
          const codeTests = exercise.codeTests || [];
          const failedTests = codeTests.filter(test => {
            const regex = new RegExp(test.pattern, test.flags || '');
            return !regex.test(code);
          });
          if (failedTests.length > 0) {
            feedbackEl.textContent = 'Check your approach:';
            feedbackEl.classList.add('wrong');
            sounds.wrong();
            resultEl.textContent += '\n\n' + failedTests.map(f => '⚠ ' + f.message).join('\n');
            showWrongBubble();
          } else {
            feedbackEl.textContent = 'Correct!';
            feedbackEl.classList.add('correct');
            sounds.correct();
            hideWrongBubble();
            const doneBtn = document.getElementById('quizDoneBtn');
            doneBtn.classList.remove('hidden');
            doneBtn.focus();
          }
        } else {
          feedbackEl.textContent = 'Not quite — try again!';
          feedbackEl.classList.add('wrong');
          sounds.wrong();
          showWrongBubble();
        }
      });
    }

    // ============================================================
    // HELP SYSTEM
    // ============================================================

    let helpCooldownTimer = null;

    document.getElementById('helpBtn').addEventListener('click', () => {
      const panel = document.getElementById('helpPanel');
      panel.classList.toggle('hidden');
      if (!panel.classList.contains('hidden')) {
        document.getElementById('helpTextarea').focus();
      }
    });

    document.getElementById('helpAskBtn').addEventListener('click', askHelp);
    document.getElementById('helpTextarea').addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        askHelp();
      }
    });

    async function askHelp() {
      const input = document.getElementById('helpTextarea');
      const question = input.value.trim() || 'Help me';

      const responseEl = document.getElementById('helpResponse');
      const askBtn = document.getElementById('helpAskBtn');
      responseEl.textContent = 'Thinking...';
      responseEl.classList.remove('hidden');
      askBtn.disabled = true;

      const exercise = currentGrokset.exercises[currentExerciseIndex];
      const systemPrompt = buildHelpPrompt(exercise);

      try {
        const response = await fetch('https://api.cerebras.ai/v1/chat/completions', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${CEREBRAS_API_KEY}`,
          },
          body: JSON.stringify({
            model: 'llama3.1-8b',
            messages: [
              { role: 'system', content: systemPrompt },
              { role: 'user', content: question },
            ],
            max_tokens: 200,
          }),
        });

        const data = await response.json();
        responseEl.textContent = data.choices?.[0]?.message?.content || 'No response';
      } catch (err) {
        responseEl.textContent = 'Error: could not reach the help service.';
      }

      input.value = '';
      startHelpCooldown();
    }

    function buildHelpPrompt(exercise) {
      const topic = currentGrokset.title;

      if (exercise.type === 'explanation' || exercise.type === 'stepper') {
        return `You are a friendly coding tutor helping an elementary/middle school student understand Python. The student is learning about ${topic}. They are currently looking at this code:\n${exercise.code}\nAnswer their question simply and concisely. Use analogies when helpful. Keep responses under 3 sentences.`;
      }

      let prompt = `You are a friendly coding tutor. The student is working on this quiz question:\n${exercise.question}`;
      if (exercise.code) prompt += `\n\nCode:\n${exercise.code}`;
      prompt += `\n\nGive a helpful hint that guides them toward the answer WITHOUT giving it away. Use leading questions or point out what to focus on. Keep responses under 3 sentences.`;

      if (exercise.type === 'quiz-code' && quizEditor) {
        const studentCode = quizEditor.getValue();
        if (studentCode && studentCode !== exercise.starterCode) {
          prompt += `\n\nThe student's current code:\n${studentCode}`;
        }
        if (lastQuizError) {
          prompt += `\n\nWhen they ran that code it produced this error:\n${lastQuizError}`;
        }
      }

      return prompt;
    }

    function startHelpCooldown() {
      const askBtn = document.getElementById('helpAskBtn');
      const cooldownEl = document.getElementById('helpCooldown');
      askBtn.disabled = true;
      cooldownEl.classList.remove('hidden');
      let remaining = 10;
      cooldownEl.textContent = `Wait ${remaining}s...`;
      helpCooldownTimer = setInterval(() => {
        remaining--;
        if (remaining <= 0) {
          clearInterval(helpCooldownTimer);
          helpCooldownTimer = null;
          askBtn.disabled = false;
          cooldownEl.textContent = '';
          cooldownEl.classList.add('hidden');
        } else {
          cooldownEl.textContent = `Wait ${remaining}s...`;
        }
      }, 1000);
    }

    // ============================================================
    // BACK BUTTON WIRING
    // ============================================================

    document.getElementById('backBtn').addEventListener('click', () => {
      document.getElementById('exerciseScreen').classList.add('hidden');
      document.getElementById('helpBtn').classList.add('hidden');
      document.getElementById('helpPanel').classList.add('hidden');
      document.getElementById('landingScreen').classList.remove('hidden');
      currentGrokset = null;
      currentExerciseIndex = 0;
      if (quizEditor) {
        quizEditor.toTextArea();
        quizEditor = null;
      }
      renderLanding();
    });

    // ============================================================
    // SOUND EFFECTS
    // ============================================================

    function createSounds() {
      let ctx;

      function getCtx() {
        if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
        return ctx;
      }

      function playTone(freq, duration, type = 'square', volume = 0.15) {
        try {
          const ac = getCtx();
          const osc = ac.createOscillator();
          const gain = ac.createGain();
          osc.type = type;
          osc.frequency.setValueAtTime(freq, ac.currentTime);
          gain.gain.setValueAtTime(volume, ac.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + duration);
          osc.connect(gain);
          gain.connect(ac.destination);
          osc.start(ac.currentTime);
          osc.stop(ac.currentTime + duration);
        } catch (e) {}
      }

      function playNotes(notes, type = 'square', volume = 0.15) {
        try {
          const ac = getCtx();
          let time = ac.currentTime;
          for (const [freq, dur] of notes) {
            const osc = ac.createOscillator();
            const gain = ac.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, time);
            gain.gain.setValueAtTime(volume, time);
            gain.gain.exponentialRampToValueAtTime(0.001, time + dur);
            osc.connect(gain);
            gain.connect(ac.destination);
            osc.start(time);
            osc.stop(time + dur);
            time += dur;
          }
        } catch (e) {}
      }

      return {
        step()      { playTone(440, 0.06, 'sine', 0.05); },
        correct()   { playNotes([[523, 0.08], [659, 0.08], [784, 0.12]], 'square', 0.12); },
        wrong()     { playNotes([[300, 0.1], [200, 0.15]], 'sawtooth', 0.1); },
        complete()  { playNotes([[523, 0.1], [659, 0.1], [784, 0.1], [1047, 0.2]], 'square', 0.15); },
      };
    }

    const sounds = createSounds();

    // ============================================================
    // INIT
    // ============================================================
    renderLanding();
  </script>
