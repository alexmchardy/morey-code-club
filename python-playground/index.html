    /**
     * Use spaces for Tab so Python never sees mixed tabs and spaces from this key.
     * @param cm CodeMirror instance
     */
    function insertSpacesTab(cm) {
      if (cm.somethingSelected()) {
        cm.indentSelection('add');
      } else {
        const unit = cm.getOption('indentUnit') || 4;
        cm.replaceSelection(' '.repeat(unit), 'end', '+input');
      }
    }

    /**
     * When every character before the cursor on this line is whitespace (and
     * there is at least one), delete back to the previous indent column
     * (indentUnit tab stops). Otherwise defer to CodeMirror default handling.
     * @param cm CodeMirror instance
     */
    function dedentWhitespaceBeforeCursor(cm) {
      const cur = cm.getCursor();
      const line = cm.getLine(cur.line);
      const ch = cur.ch;
      if (ch === 0) return CodeMirror.Pass;
      const prefix = line.slice(0, ch);
      if (!/^\s+$/.test(prefix)) return CodeMirror.Pass;
      const indentUnit = cm.getOption('indentUnit') || 4;
      const targetCh = Math.floor((ch - 1) / indentUnit) * indentUnit;
      if (targetCh >= ch) return CodeMirror.Pass;
      const from = { line: cur.line, ch: targetCh };
      const to = { line: cur.line, ch };
      cm.replaceRange('', from, to);
      cm.setCursor({ line: cur.line, ch: targetCh });
    }

    function clearTerminal() {
      terminalBody.innerHTML = '';

    function appendToTerminal(text, className = 'terminal-output') {
      const span = document.createElement('span');
      span.className = className;
      span.textContent = text;
      terminalBody.appendChild(span);
      terminalBody.scrollTop = terminalBody.scrollHeight;
    }

    function showInputCursor() {
      const wrapper = document.createElement('span');
      wrapper.className = 'terminal-input-wrapper';
      wrapper.id = 'inputWrapper';

      const textSpan = document.createElement('span');
      textSpan.className = 'terminal-input-text';
      textSpan.id = 'inputText';

      const cursor = document.createElement('span');
      cursor.className = 'terminal-cursor';
      cursor.id = 'inputCursor';

      wrapper.appendChild(textSpan);
      wrapper.appendChild(cursor);
      terminalBody.appendChild(wrapper);
      terminalBody.scrollTop = terminalBody.scrollHeight;
      terminalBody.classList.add('waiting-input');
      terminalBody.focus();
    }

    function hideInputCursor() {
      const wrapper = document.getElementById('inputWrapper');
      if (wrapper) {
        const finalText = document.getElementById('inputText').textContent;
        wrapper.remove();
        appendToTerminal(finalText + '\n', 'terminal-input-text');
      }
      terminalBody.classList.remove('waiting-input');
    }

    function handleInputKeydown(e) {
      if (!inputResolve) return;

      if (e.key === 'Enter') {
        e.preventDefault();
        const value = inputBuffer;
        inputBuffer = '';
        hideInputCursor();
        inputResolve(value);
        inputResolve = null;
      } else if (e.key === 'Backspace') {
        e.preventDefault();
        if (inputBuffer.length > 0) {
          inputBuffer = inputBuffer.slice(0, -1);
          document.getElementById('inputText').textContent = inputBuffer;
        }
      } else if (e.key.length === 1) {
        e.preventDefault();
        inputBuffer += e.key;
        document.getElementById('inputText').textContent = inputBuffer;
        terminalBody.scrollTop = terminalBody.scrollHeight;
      }
    }

    // === PROJECTS ===
    async function loadProjectManifest() {
      try {
        const manifest = await import('./projects/index.js');
        const selector = document.getElementById('projectSelector');

        manifest.default.forEach(proj => {
          const option = document.createElement('option');
          option.value = proj.id;
          option.textContent = proj.title;
          selector.appendChild(option);
        });

        // Check URL for project param
        const params = new URLSearchParams(window.location.search);
        const projectId = params.get('project');
        if (projectId) {
          selector.value = projectId;
          await loadProject(projectId);
        }
      } catch (err) {
        console.error('Failed to load project manifest:', err);
      }
    }

    async function loadProject(projectId) {
      const titleRowEl = document.getElementById('projectTitleRow');
      const titleEl = document.getElementById('projectTitle');
      const introBtn = document.getElementById('showIntroBtn');
      const descEl = document.getElementById('projectDescription');
      const contentEl = document.getElementById('projectContent');

      if (!projectId) {
        // Blank mode
        currentProject = null;
        document.title = 'Python Playground';
        titleRowEl.classList.add('hidden');
        introBtn.classList.add('hidden');
        descEl.classList.add('hidden');
        contentEl.innerHTML = '';
        editor.setValue('# Start coding!\n');
        loadSavedCode('sandbox');
        return;
      }

      try {
        const module = await import(`./projects/${projectId}.js`);
        currentProject = module.default;

        document.title = currentProject
          ? `${currentProject.title} — Python Playground`
          : 'Python Playground';

        // Update URL without reload
        const url = new URL(window.location);
        url.searchParams.set('project', projectId);
        window.history.pushState({}, '', url);

        // Show project info
        titleEl.textContent = currentProject.title;
        titleRowEl.classList.remove('hidden');

        // Show intro button only if project has an intro
        if (currentProject.intro) {
          introBtn.classList.remove('hidden');
        } else {
          introBtn.classList.add('hidden');
        }

        if (currentProject.description) {
          descEl.textContent = currentProject.description;
          descEl.classList.remove('hidden');
        } else {
          descEl.classList.add('hidden');
        }

        // Load saved state
        loadManualStepStates(projectId);
        loadSavedCode(projectId);

        // Render steps and hints
        renderProjectContent();

        // Show project intro modal if available
        showProjectIntro();

      } catch (err) {
        console.error('Failed to load project:', err);
        contentEl.innerHTML = `<p class="terminal-error">Project not found: ${projectId}</p>`;
        currentProject = null;
      }
    }

    function renderProjectContent() {
      const contentEl = document.getElementById('projectContent');
      contentEl.innerHTML = '';

      if (!currentProject) return;

      // Render steps
      if (currentProject.steps && currentProject.steps.length > 0) {
        const stepsSection = document.createElement('div');
        stepsSection.className = 'steps-section';
        stepsSection.innerHTML = '<h3 class="section-title">Steps</h3>';

        const stepsList = document.createElement('ul');
        stepsList.className = 'steps-list';
        stepsList.id = 'stepsList';

        currentProject.steps.forEach((step, index) => {
          const li = document.createElement('li');
          li.className = 'step-item';
          li.dataset.stepId = step.id;

          const checkbox = document.createElement('span');
          checkbox.className = 'step-checkbox';

          const text = document.createElement('span');
          text.className = 'step-text';
          text.textContent = step.text;

          if (step.manual) {
            li.classList.add('manual');
            li.addEventListener('click', () => toggleManualStep(step.id));
          } else {
            const badge = document.createElement('span');
            badge.className = 'step-badge';
            badge.textContent = 'auto';
            li.appendChild(badge);
          }

          li.insertBefore(checkbox, li.firstChild);
          li.appendChild(text);
          stepsList.appendChild(li);
        });

        stepsSection.appendChild(stepsList);
        contentEl.appendChild(stepsSection);
      }

      // Render hints
      if (currentProject.hints && currentProject.hints.length > 0) {
        const hintsSection = document.createElement('div');
        hintsSection.className = 'hints-section';
        hintsSection.innerHTML = '<h3 class="section-title">Hints</h3>';

        currentProject.hints.forEach((hint, index) => {
          const hintEl = document.createElement('details');
          hintEl.className = 'hint-item';

          const summary = document.createElement('summary');
          summary.className = 'hint-title';
          summary.textContent = hint.title;

          const content = document.createElement('pre');
          content.className = 'hint-content';
          content.textContent = hint.content;

          hintEl.appendChild(summary);
          hintEl.appendChild(content);
          hintsSection.appendChild(hintEl);
        });

        contentEl.appendChild(hintsSection);
      }

      // Initial step detection
      detectSteps();
    }

      if (saveCodeTimeout) clearTimeout(saveCodeTimeout);
      saveCodeTimeout = setTimeout(saveCode, 1000);

    function saveCode() {
      const projectId = currentProject ? currentProject.id : 'sandbox';

      try {

    function loadSavedCode(projectId) {
      const key = `pp-code-${projectId}`;
      try {

        if (saved !== null) {
          editor.setValue(saved);
        } else if (currentProject && currentProject.starterCode) {
          editor.setValue(currentProject.starterCode);
        } else {
          editor.setValue('# Start coding!\n');

      } catch (e) {
        console.warn('Failed to load code:', e);
        if (currentProject && currentProject.starterCode) {
          editor.setValue(currentProject.starterCode);
        }

    }

    function saveManualStepStates() {

      const key = `pp-steps-${currentProject.id}`;

    function loadManualStepStates(projectId) {
      const key = `pp-steps-${projectId}`;

        const saved = localStorage.getItem(key);

      } catch (e) {
        console.warn('Failed to load step states:', e);
        manualStepStates = {};
      }
    }

    // === STEP DETECTION ===
    function detectSteps() {
      if (!currentProject || !currentProject.steps) return;

      const code = editor.getValue();
      const stepsList = document.getElementById('stepsList');
      if (!stepsList) return;

      currentProject.steps.forEach(step => {
        const li = stepsList.querySelector(`[data-step-id="${step.id}"]`);
        if (!li) return;

        let isComplete = false;

        if (step.manual) {
          isComplete = manualStepStates[step.id] || false;
        } else if (step.detect) {
          isComplete = step.detect(code);
        }

        if (isComplete) {
          li.classList.add('completed');
        } else {
          li.classList.remove('completed');
        }
      });
    }

    function toggleManualStep(stepId) {
      manualStepStates[stepId] = !manualStepStates[stepId];
      saveManualStepStates();
      detectSteps();
    }

    let detectTimeout = null;

    function scheduleDetection() {
      if (detectTimeout) clearTimeout(detectTimeout);
      detectTimeout = setTimeout(detectSteps, 500);

      if (sayRemaining <= 0 && aiAskRemaining <= 0) {
        bar.classList.add('hidden');
        bar.textContent = '';
        if (cooldownIntervalId) {
          clearInterval(cooldownIntervalId);
          cooldownIntervalId = null;
        }
        return;
      }

      const parts = [];
      if (sayRemaining > 0) parts.push(`say ${sayRemaining}...`);
      if (aiAskRemaining > 0) parts.push(`ask_ai ${aiAskRemaining}...`);

      bar.textContent = parts.join('  ');
      bar.classList.remove('hidden');
    }

    function startCooldownTimer() {
      if (cooldownIntervalId) return;
      cooldownIntervalId = setInterval(updateCooldownBar, 1000);
      updateCooldownBar();
    }

    // === VOICE POPUP ===
    function populateVoicePopup() {
      const list = document.getElementById('voicePopupList');
      list.innerHTML = '';
      availableVoices.forEach(v => {
        const item = document.createElement('div');
        item.className = 'voice-item';
        item.innerHTML = `<span class="voice-name">${v.name}</span><span class="voice-desc">${v.description}</span>`;
        item.addEventListener('click', () => {
          navigator.clipboard.writeText(v.name).then(() => {
            item.classList.add('copied');
            setTimeout(() => item.classList.remove('copied'), 1000);
          });
        });
        list.appendChild(item);
      });
    }

    function showVoicePopup() {
      populateVoicePopup();
      document.getElementById('voicePopupOverlay').classList.remove('hidden');
    }

    function hideVoicePopup() {
      document.getElementById('voicePopupOverlay').classList.add('hidden');
    }

    // === PROJECT INTRO MODAL ===
    function showProjectIntro() {
      if (!currentProject || !currentProject.intro) return;

      document.getElementById('introModalTitle').textContent = currentProject.title;
      document.getElementById('introModalBody').innerHTML = currentProject.intro;
      document.getElementById('introModalOverlay').classList.remove('hidden');
    }

    function hideProjectIntro() {
      document.getElementById('introModalOverlay').classList.add('hidden');
    }

    /**
     * Close stacked overlays when Escape is pressed.
     * @param e Keyboard event
     */
    function handleModalEscape(e) {
      if (e.key !== 'Escape') return;
      const intro = document.getElementById('introModalOverlay');
      const voice = document.getElementById('voicePopupOverlay');
      if (!intro.classList.contains('hidden')) {
        hideProjectIntro();
        e.preventDefault();
        return;
      }
      if (!voice.classList.contains('hidden')) {
        hideVoicePopup();
        e.preventDefault();
      }
    }

    // === KONAMI CODE ===
    function handleKonamiKey(e) {
      const now = Date.now();
      if (now - lastKonamiKeyTime > KONAMI_TIMEOUT_MS) {
        konamiBuffer = [];
      }
      lastKonamiKeyTime = now;

      konamiBuffer.push(e.key);
      if (konamiBuffer.length > KONAMI_SEQUENCE.length) {
        konamiBuffer.shift();
      }

      if (konamiBuffer.length === KONAMI_SEQUENCE.length &&
          konamiBuffer.every((k, i) => k === KONAMI_SEQUENCE[i])) {
        konamiBuffer = [];
        const specialFunctions = document.getElementById('specialFunctions');
        specialFunctions.classList.remove('hidden');

        if (e.shiftKey) {
          document.getElementById('aiAskHint').classList.remove('hidden');
        } else {
          document.getElementById('voiceSayHints').classList.remove('hidden');
        }
      }
    }

    // === SKULPT BUILTINS ===
    function registerSpecialBuiltins() {
      // voice(name) - Set the current voice
      Sk.builtins['voice'] = new Sk.builtin.func(function(nameArg) {
        const name = Sk.ffi.remapToJs(nameArg);
        const voice = availableVoices.find(v =>
          v.name.toLowerCase() === name.toLowerCase()
        );
        if (voice) {
          currentVoiceId = voice.voice_id;
          return new Sk.builtin.str(`Voice set to: ${voice.name}`);
        } else {
          return new Sk.builtin.str(`Voice "${name}" not found. Use show_voices() or check the voice list.`);
        }
      });

      // say(text) - Text to speech
      Sk.builtins['say'] = new Sk.builtin.func(function(textArg) {
        const text = Sk.ffi.remapToJs(textArg);
        return Sk.misceval.promiseToSuspension(
          (async () => {
            const now = Date.now();
            const remaining = sayCooldownEnd - now;
            if (remaining > 0) {
              startCooldownTimer();
              return new Sk.builtin.str(`[say] Cooldown: wait ${Math.ceil(remaining / 1000)} seconds`);
            }

            const truncated = String(text).slice(0, SAY_MAX_CHARS);
            if (!ELEVENLABS_API_KEY) {
              return new Sk.builtin.str('[say] No API key configured');
            }

            try {
              const response = await fetch(`https://api.elevenlabs.io/v1/text-to-speech/${currentVoiceId}`, {
                method: 'POST',
                headers: {
                  'Content-Type': 'application/json',
                  'xi-api-key': ELEVENLABS_API_KEY,
                },
                body: JSON.stringify({
                  text: truncated,
                  model_id: 'eleven_flash_v2_5',
                  voice_settings: {
                    stability: 0.5,
                    similarity_boost: 0.75,
                    speed: 1.0,
                  },
                }),
              });

              if (!response.ok) {
                return new Sk.builtin.str(`[say] Error: ${response.status}`);
              }

              const audioBlob = await response.blob();
              const audioUrl = URL.createObjectURL(audioBlob);
              const audio = new Audio(audioUrl);
              await audio.play();

              sayCooldownEnd = Date.now() + SAY_COOLDOWN_MS;
              startCooldownTimer();

              return new Sk.builtin.str('');
            } catch (e) {
              return new Sk.builtin.str(`[say] Error: ${e.message}`);
            }
          })()
        );
      });

      // ask_ai(text) - Ask AI a question
      Sk.builtins['ask_ai'] = new Sk.builtin.func(function(textArg) {
        const text = Sk.ffi.remapToJs(textArg);
        return Sk.misceval.promiseToSuspension(
          (async () => {
            const now = Date.now();
            const remaining = aiAskCooldownEnd - now;
            if (remaining > 0) {
              startCooldownTimer();
              return new Sk.builtin.str(`[ask_ai] Cooldown: wait ${Math.ceil(remaining / 1000)} seconds`);
            }

            const truncated = String(text).slice(0, AI_ASK_MAX_CHARS);
            if (!CEREBRAS_API_KEY || CEREBRAS_API_KEY === 'csk-PLACEHOLDER') {
              return new Sk.builtin.str('[ask_ai] No API key configured');
            }

            try {
              const response = await fetch('https://api.cerebras.ai/v1/chat/completions', {
                method: 'POST',
                headers: {
                  'Content-Type': 'application/json',
                  'Authorization': `Bearer ${CEREBRAS_API_KEY}`,
                },
                body: JSON.stringify({
                  model: 'llama3.1-8b',
                  messages: [
                    { role: 'system', content: AI_ASK_SYSTEM_PROMPT },
                    { role: 'user', content: truncated }
                  ],
                  max_tokens: 500,
                }),
              });

              if (!response.ok) {
                return new Sk.builtin.str(`[ask_ai] Error: ${response.status}`);
              }

              const data = await response.json();
              const answer = data.choices?.[0]?.message?.content || 'No response';

              aiAskCooldownEnd = Date.now() + AI_ASK_COOLDOWN_MS;
              startCooldownTimer();

              return new Sk.builtin.str(answer);
            } catch (e) {
              return new Sk.builtin.str(`[ask_ai] Error: ${e.message}`);
            }
          })()
        );
      });
    }

    // === SKULPT CONFIG ===
    function builtinRead(filename) {
      if (Sk.builtinFiles === undefined || Sk.builtinFiles["files"][filename] === undefined) {
        throw "File not found: '" + filename + "'";
      }
      return Sk.builtinFiles["files"][filename];
    }

    // === EXECUTION ===
    async function runCode() {
      if (isRunning) return;

      isRunning = true;
      interruptExecution = false;
      runBtn.classList.add('hidden');
      stopBtn.classList.remove('hidden');
      clearTerminal();

      const code = editor.getValue();

      Sk.configure({
        output: (text) => appendToTerminal(text),
        read: builtinRead,
        inputfun: (prompt) => {
          return new Promise((resolve) => {
            if (prompt) appendToTerminal(prompt);
            inputResolve = resolve;
            inputBuffer = '';
            showInputCursor();
          });
        },
        inputfunTakesPrompt: true,
        __future__: Sk.python3,
      });

      registerSpecialBuiltins();
      Sk.execLimit = 20000; // 10 second timeout

      try {
        await Sk.misceval.asyncToPromise(() => {
          return Sk.importMainWithBody("<stdin>", false, code, true);
        });
      } catch (err) {
        appendToTerminal('\n' + err.toString(), 'terminal-error');
      }

      isRunning = false;
      runBtn.classList.remove('hidden');
      stopBtn.classList.add('hidden');
    }

    function stopCode() {
      interruptExecution = true;
      isRunning = false;
      if (inputResolve) {
        hideInputCursor();
        inputResolve = null;
        inputBuffer = '';
      }
      runBtn.classList.remove('hidden');
      stopBtn.classList.add('hidden');
      appendToTerminal('\n[Execution stopped]', 'terminal-error');
    }

    // === EVENT LISTENERS ===
    runBtn.addEventListener('click', runCode);
    stopBtn.addEventListener('click', stopCode);
    resetBtn.addEventListener('click', () => {
      if (currentProject) {
        editor.setValue(currentProject.starterCode || '# Start coding!\n');
        manualStepStates = {};
        saveManualStepStates();
        saveCode();
      } else {
        editor.setValue('# Start coding!\n');
        saveCode();
      }
      clearTerminal();
      detectSteps();
    });
    terminalBody.addEventListener('keydown', handleInputKeydown);

    document.getElementById('projectSelector').addEventListener('change', (e) => {
      loadProject(e.target.value);
    });

    // Konami code listener
    document.addEventListener('keydown', handleKonamiKey);

    // Voice popup listeners
    document.getElementById('showVoicesBtn').addEventListener('click', showVoicePopup);
    document.getElementById('voicePopupClose').addEventListener('click', hideVoicePopup);
    document.getElementById('voicePopupOverlay').addEventListener('click', (e) => {
      if (e.target === e.currentTarget) hideVoicePopup();
    });

    // Project intro modal listeners
    document.getElementById('introModalClose').addEventListener('click', hideProjectIntro);
    document.getElementById('introModalStart').addEventListener('click', hideProjectIntro);
    document.getElementById('introModalOverlay').addEventListener('click', (e) => {
      if (e.target === e.currentTarget) hideProjectIntro();
    });
    document.getElementById('showIntroBtn').addEventListener('click', showProjectIntro);
    document.addEventListener('keydown', handleModalEscape);

    // Initialize
    fetchAvailableVoices();
    loadProjectManifest();
  </script>
</body>
