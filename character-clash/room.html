  async function retryWithBackoff(fn, maxRetries, initialDelayMs = 500) {
    let lastError;
    for (let attempt = 0; attempt <= maxRetries; attempt++) {
      try {
        return await fn();
      } catch (e) {
        lastError = e;
        if (attempt < maxRetries) {
          const delay = initialDelayMs * Math.pow(2, attempt);
          console.log(`Retry ${attempt + 1}/${maxRetries} after ${delay}ms...`);
          await sleep(delay);
        }
      }
    }
    throw lastError;
  }

  async function fetchVoicesFromCollection() {
    if (!ELEVENLABS_API_KEY) return;

    try {
      const response = await fetch(`https://api.elevenlabs.io/v2/voices?page_size=100&collection_id=${CHARACTER_CLASH_COLLECTION_ID}`, {

        return;

      const data = await response.json();
      availableVoices = data.voices.map(v => ({
        voice_id: v.voice_id,
        name: v.name,
        description: v.description || v.labels?.descriptive || ''

          characterData.items = items.map(String);
        } else {
          characterData.items = [String(items)];
        }
      };

      try {
        const fn = new Function('location', 'setFullName', 'setMood', 'setDescription', 'setBackstory', 'setItems', code);
        fn(location, setFullName, setMood, setDescription, setBackstory, setItems);
      } catch (e) {
        console.error('JS execution error:', e);
      }
    } else {
      try {
        const fullCode = `
location = ${JSON.stringify(location)}
_char_data = {"fullName": None, "mood": None, "description": None, "backstory": None, "items": None}

def set_full_name(name):
    _char_data["fullName"] = str(name)

def set_mood(mood):
    _char_data["mood"] = str(mood)

def set_description(desc):
    _char_data["description"] = str(desc)

def set_backstory(story):
    _char_data["backstory"] = str(story)

def set_items(items):
    if isinstance(items, list):
        _char_data["items"] = [str(i) for i in items]
    else:
        _char_data["items"] = [str(items)]

${code}

import json
print(json.dumps(_char_data))
`;

        let output = '';
        Sk.configure({
          output: (text) => { output += text; },
          read: (filename) => {
            if (Sk.builtinFiles === undefined || Sk.builtinFiles["files"][filename] === undefined) {
              throw new Error("File not found: '" + filename + "'");
            }
            return Sk.builtinFiles["files"][filename];
          },
        });

        await Sk.misceval.asyncToPromise(() => {
          return Sk.importMainWithBody("<stdin>", false, fullCode, true);
        });

        const result = JSON.parse(output.trim());
        Object.assign(characterData, result);
      } catch (e) {
        console.error('Python execution error:', e);
      }
    }

    return characterData;
  }

  function normalizeVoiceIds(script) {
    if (!script || !Array.isArray(script)) return;

    const speakerVoices = new Map();
    for (const line of script) {
      if (!line.speaker || !line.voice_id) continue;
      if (!speakerVoices.has(line.speaker)) {
        speakerVoices.set(line.speaker, line.voice_id);
      }
    }

    const usedVoices = new Set();
    const speakers = Array.from(speakerVoices.keys());

    for (const speaker of speakers) {
      let voiceId = speakerVoices.get(speaker);

      if (usedVoices.has(voiceId)) {
        const unusedVoices = availableVoices.filter(v => !usedVoices.has(v.voice_id));
        if (unusedVoices.length > 0) {
          const randomVoice = unusedVoices[Math.floor(Math.random() * unusedVoices.length)];
          voiceId = randomVoice.voice_id;
          speakerVoices.set(speaker, voiceId);
        }
      }

      usedVoices.add(voiceId);
    }

    for (const line of script) {
      if (line.speaker && speakerVoices.has(line.speaker)) {
        line.voice_id = speakerVoices.get(line.speaker);
      }
    }
  }

  async function generateScript(charA, charB, dataA, dataB, location) {
    if (!CEREBRAS_API_KEY) {
      return {
        script: [{ speaker: 'Narrator', line: 'No API key configured for script generation.', voice_id: availableVoices[0]?.voice_id }],
        xp_a: 0,
        xp_b: 0
      };
    }

    const systemPrompt = getSystemPrompt();

    const nameA = charA.character_name;
    const fullNameA = dataA.fullName || charA.character_name;
    const nameB = charB.character_name;
    const fullNameB = dataB.fullName || charB.character_name;

    const userPrompt = `CHARACTER A: "${nameA}" (created by ${charA.student_name})
- Full Name: ${fullNameA}
- Mood: ${dataA.mood || 'neutral'}
- Description: ${dataA.description || 'No description'}
- Backstory: ${dataA.backstory || 'Unknown'}
- Items: ${dataA.items ? dataA.items.join(', ') : 'None'}

CHARACTER B: "${nameB}" (created by ${charB.student_name})
- Full Name: ${fullNameB}
- Mood: ${dataB.mood || 'neutral'}
- Description: ${dataB.description || 'No description'}
- Backstory: ${dataB.backstory || 'Unknown'}
- Items: ${dataB.items ? dataB.items.join(', ') : 'None'}

LOCATION: ${location}

Write the encounter script. Use "${nameA}" and "${nameB}" as speaker names.`;

    try {
      const result = await retryWithBackoff(async () => {
        const response = await fetch('https://api.cerebras.ai/v1/chat/completions', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${CEREBRAS_API_KEY}`,
          },
          body: JSON.stringify({
            model: 'llama3.1-8b',
            messages: [
              { role: 'system', content: systemPrompt },
              { role: 'user', content: userPrompt }
            ],
            max_tokens: 1200,
          }),
        });

        if (!response.ok) {
          throw new Error(`LLM API error: ${response.status}`);
        }

        const data = await response.json();
        const content = data.choices?.[0]?.message?.content || '';

        const jsonMatch = content.match(/\{[\s\S]*\}/);
        if (!jsonMatch) {
          throw new Error('No JSON found in LLM response');
        }

        const parsed = JSON.parse(jsonMatch[0]);
        normalizeVoiceIds(parsed.script);
        return parsed;
      }, 2, 500);

      return result;
    } catch (e) {
      console.error('LLM error after retries:', e);
    }

    return {
      script: [{ speaker: 'Narrator', line: 'The encounter was... inconclusive.', voice_id: 'YOq2y2Up4RgXP2HyXjE5' }],
      xp_a: 0,
      xp_b: 0
    };
  }

  function getRandomVoice() {
    if (availableVoices.length === 0) return null;
    return availableVoices[Math.floor(Math.random() * availableVoices.length)];
  }

  async function announceXPResults(xpExplanation) {
    if (!xpExplanation) return;

    if (!ELEVENLABS_API_KEY || !audioUnlocked) {
      await sleep(2000);
      return;
    }

    let announcerVoiceId = 'YOq2y2Up4RgXP2HyXjE5'; // Xavier

    const attemptTTS = async (voiceId) => {
      return await fetch(`https://api.elevenlabs.io/v1/text-to-speech/${voiceId}`, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'xi-api-key': ELEVENLABS_API_KEY,
        },
        body: JSON.stringify({
          text: xpExplanation,
          model_id: 'eleven_flash_v2_5',
          voice_settings: {
            stability: 0.5,
            similarity_boost: 0.75,
            speed: 1.0,
          },
        }),
      });
    };

    try {
      let response = await attemptTTS(announcerVoiceId);

      if (!response.ok) {
        if (response.status === 404) {
          console.warn(`Announcer voice ${announcerVoiceId} not found (404), using random voice`);
          const newVoice = getRandomVoice();
          if (newVoice) {
            announcerVoiceId = newVoice.voice_id;
            response = await attemptTTS(announcerVoiceId);
          }
        } else {
          console.log(`TTS announcement error ${response.status}, retrying once...`);
          await sleep(500);
          response = await attemptTTS(announcerVoiceId);
        }
      }

      if (!response.ok) {
        console.error('TTS announcement error after retry:', response.status);
        await sleep(2000);
        return;
      }

      const audioBlob = await response.blob();
      const audioUrl = URL.createObjectURL(audioBlob);
      const audio = new Audio(audioUrl);

      await new Promise((resolve) => {
        audio.onended = () => {
          URL.revokeObjectURL(audioUrl);
          resolve();
        };
        audio.onerror = () => {
          URL.revokeObjectURL(audioUrl);
          resolve();
        };
        audio.play().catch(() => resolve());
      });
    } catch (e) {
      console.error('TTS announcement error:', e);
      try {
        await sleep(500);
        const retryResponse = await attemptTTS(announcerVoiceId);
        if (retryResponse.ok) {
          const audioBlob = await retryResponse.blob();
          const audioUrl = URL.createObjectURL(audioBlob);
          const audio = new Audio(audioUrl);
          await new Promise((resolve) => {
            audio.onended = () => { URL.revokeObjectURL(audioUrl); resolve(); };
            audio.onerror = () => { URL.revokeObjectURL(audioUrl); resolve(); };
            audio.play().catch(() => resolve());
          });
        }
      } catch (retryErr) {
        console.error('TTS announcement retry error:', retryErr);
        await sleep(2000);
      }
    }
  }

  function highlightScriptLine(index) {
    const lines = scriptText.querySelectorAll('.script-line');
    lines.forEach((el, i) => {
      el.classList.remove('speaking');
      if (i < index) {
        el.classList.add('spoken');
      }
    });
    const currentLine = lines[index];
    if (currentLine) {
      currentLine.classList.add('speaking');
      currentLine.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }
  }

  async function playScriptWithTTS(script) {
    if (!ELEVENLABS_API_KEY || !audioUnlocked || script.length === 0) {
      for (let i = 0; i < script.length; i++) {
        highlightScriptLine(i);
        await sleep(2000);
      }
      return;
    }

    const voiceReplacements = new Map();

    for (let i = 0; i < script.length; i++) {
      const line = script[i];
      let voiceId = line.voice_id;

      highlightScriptLine(i);

      if (!voiceId) continue;

      if (voiceReplacements.has(line.speaker)) {
        voiceId = voiceReplacements.get(line.speaker);
      }

      const attemptTTS = async (vid) => {
        const response = await fetch(`https://api.elevenlabs.io/v1/text-to-speech/${vid}`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'xi-api-key': ELEVENLABS_API_KEY,
          },
          body: JSON.stringify({
            text: line.line,
            model_id: 'eleven_flash_v2_5',
            voice_settings: {
              stability: 0.5,
              similarity_boost: 0.75,
              speed: 1.0,
            },
          }),
        });
        return response;
      };

      try {
        let response = await attemptTTS(voiceId);

        if (!response.ok) {
          if (response.status === 404) {
            console.warn(`Voice ${voiceId} not found (404), replacing with random voice for ${line.speaker}`);
            const newVoice = getRandomVoice();
            if (newVoice) {
              voiceId = newVoice.voice_id;
              voiceReplacements.set(line.speaker, voiceId);
              response = await attemptTTS(voiceId);
            }
          } else {
            console.log(`TTS error ${response.status}, retrying once...`);
            await sleep(500);
            response = await attemptTTS(voiceId);
          }
        }

        if (!response.ok) {
          console.error('TTS error after retry:', response.status);
          continue;
        }

        const audioBlob = await response.blob();
        const audioUrl = URL.createObjectURL(audioBlob);
        const audio = new Audio(audioUrl);

        await new Promise((resolve) => {
          audio.onended = () => {
            URL.revokeObjectURL(audioUrl);
            resolve();
          };
          audio.onerror = () => {
            URL.revokeObjectURL(audioUrl);
            resolve();
          };
          audio.play().catch(() => resolve());
        });

        await sleep(300);
      } catch (e) {
        console.error('TTS error:', e);
        try {
          await sleep(500);
          const retryResponse = await attemptTTS(voiceId);
          if (retryResponse.ok) {
            const audioBlob = await retryResponse.blob();
            const audioUrl = URL.createObjectURL(audioBlob);
            const audio = new Audio(audioUrl);
            await new Promise((resolve) => {
              audio.onended = () => { URL.revokeObjectURL(audioUrl); resolve(); };
              audio.onerror = () => { URL.revokeObjectURL(audioUrl); resolve(); };
              audio.play().catch(() => resolve());
            });
            await sleep(300);
          }
        } catch (retryErr) {
          console.error('TTS retry error:', retryErr);
        }
      }
    }
  }

  function displayCharacterCard(prefix, char, data) {
    document.getElementById(`${prefix}-name`).textContent = char.character_name;
    document.getElementById(`${prefix}-fullname`).textContent = data.fullName || 'Unknown';
    document.getElementById(`${prefix}-student`).textContent = char.student_name;
    document.getElementById(`${prefix}-mood`).textContent = data.mood ? `"${data.mood}"` : '';
    document.getElementById(`${prefix}-desc`).textContent = data.description || '';
    document.getElementById(`${prefix}-items`).textContent = data.items ? `Items: ${data.items.join(', ')}` : '';

    const xpEl = document.getElementById(`${prefix}-xp`);
    xpEl.classList.add('hidden');
    xpEl.classList.remove('positive', 'negative');
  }

  function showXPResult(prefix, xpDelta) {
    const xpEl = document.getElementById(`${prefix}-xp`);
    xpEl.classList.remove('hidden');
    xpEl.classList.add(xpDelta >= 0 ? 'positive' : 'negative');
    xpEl.textContent = xpDelta >= 0 ? `+${xpDelta} XP` : `${xpDelta} XP`;
  }

  async function startEncounter(encounter) {
    if (isPlaying) return;
    isPlaying = true;
    currentEncounter = encounter;

    const charA = characters.find(c => c.id === encounter.character_a_id);
    const charB = characters.find(c => c.id === encounter.character_b_id);

    if (!charA || !charB) {
      console.error('Characters not found');
      isPlaying = false;
      return;
    }

    await db.from('cc_encounter_queue').update({ status: 'playing' }).eq('id', encounter.id);

    idleMessage.classList.remove('visible');
    locationBanner.textContent = encounter.location.toUpperCase();
    locationBanner.style.display = 'block';
    encounterArena.style.display = 'flex';
    scriptArea.classList.remove('visible');

    const [dataA, dataB] = await Promise.all([
      executeCharacterCode(charA.code, charA.language, encounter.location),
      executeCharacterCode(charB.code, charB.language, encounter.location),
    ]);

    displayCharacterCard('char-a', charA, dataA);
    displayCharacterCard('char-b', charB, dataB);

    await sleep(1500);

    const result = await generateScript(charA, charB, dataA, dataB, encounter.location);
    const { script, xp_a, xp_b, xp_explanation } = result;

    const scriptHtml = script.map((s, index) => {
      const speakerLower = s.speaker.toLowerCase();
      const charAName = charA.character_name.toLowerCase();
      const charBName = charB.character_name.toLowerCase();
      let speakerClass = 'narrator';
      if (speakerLower === charAName || speakerLower.includes(charAName) || charAName.includes(speakerLower)) {
        speakerClass = 'char-a';
      } else if (speakerLower === charBName || speakerLower.includes(charBName) || charBName.includes(speakerLower)) {
        speakerClass = 'char-b';
      }
      return `<div class="script-line" data-index="${index}"><div class="script-speaker ${speakerClass}">${escapeHtml(s.speaker)}</div><div class="script-dialogue">"${escapeHtml(s.line)}"</div></div>`;
    }).join('');
    scriptText.innerHTML = scriptHtml;
    scriptArea.classList.add('visible');

    await playScriptWithTTS(script);

    scriptArea.classList.remove('visible');

    showXPResult('char-a', xp_a);
    showXPResult('char-b', xp_b);

    await announceXPResults(xp_explanation);

    const winnerId = xp_a > xp_b ? charA.id : xp_b > xp_a ? charB.id : null;

    await db.rpc('update_cc_encounter', {
      p_encounter_id: encounter.id,
      p_status: 'completed',
      p_winner_character_id: winnerId,
      p_xp_delta_a: xp_a,
      p_xp_delta_b: xp_b,
      p_script: result,
    });

    await sleep(tournament?.encounter_delay_ms || 5000);

    encounterArena.style.display = 'none';
    locationBanner.style.display = 'none';
    idleMessage.classList.add('visible');

    isPlaying = false;
    currentEncounter = null;

    await loadCharacters();
    await loadEncounterQueue();

    if (tournament?.continuous) {
      checkForNextEncounter();
    }
  }

  async function checkForNextEncounter() {
    if (isPlaying || !tournament || tournament.paused) return;

    const pendingEncounter = encounterQueue.find(e => e.status === 'pending');
    if (pendingEncounter) {
      startEncounter(pendingEncounter);
    }
  }

  function renderCharactersList() {
    const latestChars = getLatestVersions(characters);

    if (latestChars.length === 0) {
      charactersList.innerHTML = '<div class="no-items">No characters yet</div>';
      return;
    }

    charactersList.innerHTML = latestChars.map(ch => {
      const xpClass = ch.xp > 0 ? 'positive' : ch.xp < 0 ? 'negative' : 'neutral';
      const xpText = ch.xp >= 0 ? `+${ch.xp}` : ch.xp;
      return `
        <div class="character-item">
          <div class="character-item-name">${escapeHtml(ch.character_name)}</div>
          <div class="character-item-student">${escapeHtml(ch.student_name)}</div>
          <div class="character-item-xp ${xpClass}">${xpText} XP</div>
        </div>
      `;
    }).join('');
  }

  function renderLeaderboard() {
    const latestChars = getLatestVersions(characters);
    const sorted = [...latestChars].sort((a, b) => b.xp - a.xp);

    if (sorted.length === 0) {
      leaderboardEl.innerHTML = '<div class="no-items">No characters yet</div>';
      return;
    }

    leaderboardEl.innerHTML = sorted.slice(0, 10).map((ch, i) => {
      const xpText = ch.xp >= 0 ? `+${ch.xp}` : ch.xp;
      return `
        <div class="lb-row">
          <span class="lb-rank">${i + 1}</span>
          <span class="lb-name">${escapeHtml(ch.character_name)}</span>
          <span class="lb-score">${xpText}</span>
        </div>
      `;
    }).join('');
  }

  function renderEncounterQueue() {
    const pending = encounterQueue.filter(e => e.status === 'pending' || e.status === 'playing');

    if (pending.length === 0) {
      queueItemsEl.innerHTML = '<span style="color:var(--text-dim);font-size:11px;">Empty</span>';
      return;
    }

    queueItemsEl.innerHTML = pending.slice(0, 5).map(enc => {
      const chA = characters.find(c => c.id === enc.character_a_id);
      const chB = characters.find(c => c.id === enc.character_b_id);
      const nameA = chA ? chA.character_name : '?';
      const nameB = chB ? chB.character_name : '?';
      return `<div class="queue-item ${enc.status}">${escapeHtml(nameA)} vs ${escapeHtml(nameB)}<span class="queue-item-remove" onclick="removeEncounter('${enc.id}')" title="Remove">✕</span></div>`;
    }).join('');
  }

  async function removeEncounter(encounterId) {
    const { error } = await db.from('cc_encounter_queue').delete().eq('id', encounterId);
    if (error) {
      console.error('Failed to remove encounter:', error);
    }
  }

  async function loadTournament() {
    const { data, error } = await db
      .from('cc_tournaments')
      .select('*')
      .eq('is_active', true)
      .order('created_at', { ascending: false })
      .limit(1)
      .maybeSingle();

    if (error || !data) {
      headerTournament.textContent = 'No active tournament';
      return false;
    }

    tournament = data;
    headerTournament.textContent = data.name;

    if (data.paused) {
      pausedOverlay.classList.add('visible');
    }

    return true;
  }

  async function loadCharacters() {
    if (!tournament) return;

    const { data } = await db
      .from('cc_characters')
      .select('id, character_name, student_name, version, code, language, xp, submitted_at')
      .eq('tournament_id', tournament.id)
      .eq('is_archived', false)
      .order('submitted_at', { ascending: false });

    characters = data || [];
    renderCharactersList();
    renderLeaderboard();
    renderEncounterQueue();
  }

  async function loadEncounterQueue() {
    if (!tournament) return;

    const { data } = await db
      .from('cc_encounter_queue')
      .select('id, character_a_id, character_b_id, location, position, status')
      .eq('tournament_id', tournament.id)
      .order('position', { ascending: true });

    encounterQueue = data || [];
    renderEncounterQueue();

    if (!isPlaying && tournament?.continuous) {
      checkForNextEncounter();
    }
  }

  function waitForUnpause() {
    return new Promise(resolve => {
      const check = () => {
        if (!tournament?.paused) {
          resolve();
        } else {
          setTimeout(check, 500);
        }
      };
      check();
    });
  }

  function subscribeToRealtime() {
    if (!tournament) return;

    db.channel('room-characters-' + tournament.id)
      .on('postgres_changes', {
        event: '*', schema: 'code_mob', table: 'cc_characters',
        filter: `tournament_id=eq.${tournament.id}`,
      }, () => loadCharacters())
      .subscribe((status) => {
        if (status === 'SUBSCRIBED') setConnStatus('connected');
        else if (status === 'CHANNEL_ERROR') setConnStatus('disconnected');
      });

    db.channel('room-queue-' + tournament.id)
      .on('postgres_changes', {
        event: '*', schema: 'code_mob', table: 'cc_encounter_queue',
        filter: `tournament_id=eq.${tournament.id}`,
      }, async (payload) => {
        await loadEncounterQueue();
        const newStatus = payload.new?.status || payload.eventType === 'INSERT' && 'pending';
        if (newStatus === 'pending' && !isPlaying && tournament?.continuous) {
          checkForNextEncounter();
        }
      })
      .subscribe();

    db.channel('room-tournament-' + tournament.id)
      .on('postgres_changes', {
        event: 'UPDATE', schema: 'code_mob', table: 'cc_tournaments',
        filter: `id=eq.${tournament.id}`,
      }, (payload) => {
        tournament = payload.new;
        if (tournament.paused) {
          pausedOverlay.classList.add('visible');
        } else {
          pausedOverlay.classList.remove('visible');
          if (!isPlaying && tournament.continuous) {
            checkForNextEncounter();
          }
        }
      })
      .subscribe();
  }

  async function init() {
    setConnStatus('connecting');
    await fetchVoicesFromCollection();
    const ok = await loadTournament();
    if (ok) {
      await loadCharacters();
      await loadEncounterQueue();
      subscribeToRealtime();
      checkForNextEncounter();
    }
  }

  init();
</script>
